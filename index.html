<style>
:root {
  --paper: #FBFAF8;
  --paper-raised: #FFFFFF;
  --paper-sunken: #F2F1EE;
  --line: #E8E6E1;
  --line-strong: #D2CFC8;

  --text: #1D1D1F;
  --text-soft: #6E6E73;
  --text-faint: #A1A1A6;

  --ink: #1F6F5C;
  --ink-hover: #185848;
  --ink-wash: #E4EFEA;
  --ink-on: #F7FDFB;

  --brass: #A8763E;
  --brass-wash: #F4EBDD;

  --ok: #3D7A46;
  --ok-wash: #E6F0E4;
  --warn: #9A6B1F;
  --warn-wash: #F6EEDA;
  --err: #A8453A;
  --err-wash: #F5E4E1;

  --font-ui: "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, monospace;
  --font-display: "Amiri", "IBM Plex Sans Arabic", serif;

  --fs-display: 20px;
  --fs-title: 15px;
  --fs-body: 13px;
  --fs-strong: 13px;
  --fs-caption: 11.5px;

  --r-outer: 20px;
  --r-mid: 10px;
  --r-inner: 8px;
  --r-round: 999px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  --control-h: 36px;
  --control-h-lg: 44px;
  --row-h: 44px;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .04), 0 0 0 .5px rgba(0, 0, 0, .05);
  --shadow-2: 0 8px 30px rgba(0, 0, 0, .08), 0 0 0 .5px rgba(0, 0, 0, .05);
  --scrim: rgba(20, 18, 14, .32);
  --shadow-print-page: 0 12px 32px rgba(43, 42, 38, .18), 0 0 0 1px rgba(43, 42, 38, .02);
  --ease: cubic-bezier(.32, .72, 0, 1);
  --motion-fast: 150ms var(--ease);
  --motion-panel: 200ms var(--ease);
  --motion-toast: 250ms var(--ease);
}

:root[data-theme="dark"] {
  --paper: #1C1C1E;
  --paper-raised: #2C2C2E;
  --paper-sunken: #242426;
  --line: #3A3A3C;
  --line-strong: #48484A;

  --text: #F2F2F7;
  --text-soft: #AEAEB2;
  --text-faint: #8E8E93;

  --ink: #4FA98D;
  --ink-hover: #63BBA0;
  --ink-wash: #24352F;
  --ink-on: #10201B;

  --brass: #C79A62;
  --brass-wash: #332B1F;

  --ok: #6FAE76;
  --ok-wash: #24301F;
  --warn: #C9964B;
  --warn-wash: #332B18;
  --err: #C96B5E;
  --err-wash: #33211D;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .3), 0 0 0 .5px rgba(0, 0, 0, .4);
  --shadow-2: 0 8px 30px rgba(0, 0, 0, .45), 0 0 0 .5px rgba(0, 0, 0, .3);
  --scrim: rgba(0, 0, 0, .55);
  --shadow-print-page: 0 12px 32px rgba(0, 0, 0, .55), 0 0 0 1px rgba(0, 0, 0, .08);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --motion-fast: 1ms linear;
    --motion-panel: 1ms linear;
    --motion-toast: 1ms linear;
  }
}

.glass { background: var(--paper); }
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  .glass {
    background: color-mix(in srgb, var(--paper) 72%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }

body {
  direction: rtl;
  font-family: var(--font-ui);
  font-size: var(--fs-body);
  font-weight: 400;
  line-height: 1.6;
  color: var(--text);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p, dl, dd { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
a { color: inherit; text-decoration: none; }

table { border-collapse: collapse; width: 100%; }

.num, [data-num], .cell-num {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  unicode-bidi: isolate;
  text-align: end;
}

.page-cell--num { unicode-bidi: isolate; }

.fs-display { font-size: var(--fs-display); font-weight: 600; }
.fs-title { font-size: var(--fs-title); font-weight: 600; font-family: var(--font-display); }
.fs-body { font-size: var(--fs-body); font-weight: 400; }
.fs-strong { font-size: var(--fs-body); font-weight: 600; }
.fs-caption { font-size: var(--fs-caption); font-weight: 400; }

.text-soft { color: var(--text-soft); }
.text-faint { color: var(--text-faint); }
.money { color: var(--brass); font-weight: 600; }

:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
  border-color: var(--ink) !important;
  box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink);
}

@media (forced-colors: active) {
  :focus-visible { outline: 2px solid Highlight; box-shadow: none; }
}

*, *::before, *::after {
  transition-property: background-color, border-color, color, box-shadow, opacity, transform;
  transition-duration: var(--motion-fast);
}

body.theme-transition-lock, body.theme-transition-lock * {
  transition: none !important;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: var(--r-round); }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}


.app-shell {
  display: grid;
  grid-template-rows: 56px auto 1fr;
  grid-template-columns: 1fr;
  grid-template-areas: "titlebar" "banner" "main";
  height: 100vh;
  background: var(--paper);
}

.title-bar {
  grid-area: titlebar;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 0 var(--sp-4);
  box-shadow: inset 0 -.5px 0 0 var(--line);
  position: relative;
  z-index: 30;
  min-width: 0;
}

.title-bar__mark {
  width: 28px;
  height: 28px;
  border-radius: var(--r-inner);
  background: var(--ink-wash);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}

.title-bar__name {
  font-size: var(--fs-title);
  font-weight: 600;
  font-family: var(--font-display);
}

.title-bar__spacer { flex: 1; }

.title-bar__save-state {
  font-size: var(--fs-caption);
  color: var(--text-soft);
  display: flex;
  align-items: center;
  gap: var(--sp-1);
}

.report-tabs {
  display: flex;
  align-items: stretch;
  gap: var(--sp-1);
  overflow-x: auto;
  scrollbar-width: none;
  min-width: 0;
}
.report-tabs::-webkit-scrollbar { display: none; }

.report-switcher-dropdown-wrap { display: none; }
#btn-report-switcher-dropdown { max-width: 200px; }
#btn-report-switcher-dropdown span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 1000px) {
  .report-tabs { display: none; }
  .report-switcher-dropdown-wrap { display: block; }
}

.report-tab-h {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-3);
  color: var(--text-soft);
  font-size: var(--fs-body);
  font-family: var(--font-display);
  white-space: nowrap;
  border-bottom: 2px solid transparent;
}

.field {

.table-wrap {

table.grid { table-layout: fixed; }

.grid thead th {

.toast-stack {

.drop-zone {

@media print {

  align-items: center;

.page-row.filler { border-bottom: 0.2mm solid #D8D3C6; }

.page-row.block-close { border-bottom: 0.5mm solid #16140F; }

.page-cell {
  padding: 0 2mm;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.page-cell--num {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  text-align: end;
}

.page-cell--shrink-flag::after {
  content: "•";
  color: #A8453A;
  margin-inline-start: 2px;
}

.calibration-ruler {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.calibration-ruler line, .calibration-ruler rect {
  stroke: var(--brass);
}

.print-preview-shell {
  background: var(--paper-sunken);
  padding: var(--sp-6);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-6);
  overflow: auto;
  height: 100%;
}

.print-preview-page {
  background: #FFFFFF;
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-print-page);
  transform-origin: top center;
}

.print-preview-page--placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-faint);
}

.print-preview-toolbar {
  position: sticky;
  top: 0;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  background: var(--paper);
  padding: var(--sp-3) var(--sp-6);
  box-shadow: inset 0 -.5px 0 0 var(--line);
  z-index: 5;
}

</style>

  function restoreWorkspaceBackup(file) {
    var reader = new FileReader;

        payload = JSON.parse(String(reader.result || ""));

      } catch (err) {

        actions: [
          { label: "إلغاء", value: false, variant: "secondary" },
          { label: "استبدال", value: true, variant: "danger" }
        ]
      }).then(function (confirmed) {
        if (!confirmed) return;
        try {
        store.setSourceRows(payload.rows, "استعادة نسخة احتياطية", true);
        if (payload.settingsOverrides) {
          var restored = payload.settingsOverrides || {};
          var sanitizedGlobal = {};
          if (restored.global && "rowsPerPage" in restored.global) {
            sanitizedGlobal.rowsPerPage = cfg.ROWS_PER_PAGE_PRESETS.indexOf(restored.global.rowsPerPage) !== -1 ? restored.global.rowsPerPage : cfg.ROWS_PER_PAGE_PRESETS[0];
          }
          var sanitizedReport = {};
          Object.keys(restored.report || {}).forEach(function(rid) {
            if (!cfg.REPORTS_BY_ID[rid]) return;
            var bucket = restored.report[rid] || {};
            var clean = {};
            Object.keys(bucket).forEach(function(k) {
              clean[k] = PH.settings.sanitize(rid, k, bucket[k]);

            sanitizedReport[rid] = clean;

            report: sanitizedReport,

          state.settingsVersion++;

          Object.keys(sanitizedReport).forEach(function(rid) {

          });
          writes.push(store.saveSettings("meta", "linked", state.settingsOverrides.linked));
          Promise.all(writes).catch(function() {});
        }
        if (payload.activeMonth !== undefined) state.activeMonth = payload.activeMonth;
        if (payload.activeReportId && cfg.REPORTS_BY_ID[payload.activeReportId]) state.activeReportId = payload.activeReportId;
        if (payload.dimensionGroups) state.dimensionGroups = payload.dimensionGroups;

            var legal = cfg.printableColumns(repDef.columns);

        } catch (err) {
          showToast("تعذّرت استعادة النسخة: " + (err && err.message ? err.message : "ملف غير صالح"), false);
        }
      });
