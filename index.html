  function decodeTextBuffer(buffer) {
    if (typeof TextDecoder === "undefined") return String(buffer || "");
    try { return new TextDecoder("utf-8", { fatal: true }).decode(buffer); }
    catch (utf8Error) {
      try { return new TextDecoder("windows-1256").decode(buffer); }
      catch (legacyError) { return new TextDecoder("utf-8").decode(buffer); }
    }
  }

  function handleFile(file) {
    var ext = importer.fileExtensionOf(file.name);
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var wb;
        if (ext === "csv") {
          var csvText = decodeTextBuffer(reader.result);
          var delimiter = csvText.indexOf("\t") !== -1 ? "\t" : (csvText.indexOf(";") !== -1 ? ";" : ",");
          wb = importer.readWorkbookFromText(csvText, delimiter);
        } else wb = importer.readWorkbookFromArrayBuffer(reader.result);
        startImportFlow(wb);
      } catch (err) {
        showToast("تعذّرت قراءة الملف: " + (err && err.message ? err.message : "ملف غير صالح"), false);
      }
    };
    if (ext === "csv") reader.readAsArrayBuffer(file);
    else reader.readAsArrayBuffer(file);
  }

  function bindPaste() {
    document.addEventListener("paste", function (e) {
      var target = e.target;
      var isEditable = target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.tagName === "SELECT" || target.isContentEditable);
      if (isEditable) return;
      var text = e.clipboardData && e.clipboardData.getData("text");
      if (!text || text.indexOf("\n") === -1 && text.indexOf("\t") === -1) return;
      e.preventDefault();
      try {
        var wb = importer.parseClipboardText(text);
        if (wb && wb.SheetNames && wb.SheetNames.length) openImportWizard(wb);
      } catch (err) {
        showToast("تعذّرت قراءة المحتوى الملصق", false);
      }
    });
  }

  function openImportWizard(workbook) {
    var wiz = {
      step: workbook.SheetNames.length > 1 ? 0 : 1,
      workbook: workbook,
      sheetName: workbook.SheetNames[0],
      sampleAoa: [],
      headerRowIndex: 0,
      mapping: {},
      mergeSuggestions: {},
      mergeDecisions: {},
      extracted: [],
      enumCoercions: [],
      excludedRowIndexes: {},
      validation: null
    };

    var STEP_LABELS = ["الملف والورقة", "صف العناوين", "الأعمدة", "التعبئة التلقائية", "المراجعة"];

    var overlay = el("div", { role: "dialog", "aria-modal": "true", "aria-label": "استيراد البيانات", style: "position:fixed; inset:0; background:var(--paper-sunken); z-index:60; display:flex; flex-direction:column;" });
    var headerBar = el("div", { style: "padding:var(--sp-4) var(--sp-6); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:var(--sp-2);" });
    var stepsHost = el("div", { class: "row", style: "gap:var(--sp-2); flex-wrap:wrap;" });
    var cancelBtn = el("button", { class: "btn btn--tertiary" }, [text("إلغاء الاستيراد")]);
    headerBar.appendChild(stepsHost);
    headerBar.appendChild(cancelBtn);
    var body = el("div", { style: "flex:1; overflow:auto; padding:var(--sp-6);" });
    var footer = el("div", { style: "padding:var(--sp-4) var(--sp-6); border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;" });
    overlay.appendChild(headerBar);
    overlay.appendChild(body);
    overlay.appendChild(footer);
    document.body.appendChild(overlay);
    document.body.classList.add("modal-open");

    cancelBtn.addEventListener("click", function () { removeDialog(overlay); });

    function initFromSheet() {
      var ws = wiz.workbook.Sheets[wiz.sheetName];
      wiz.sampleAoa = importer.sheetToAoa(ws).slice(0, 15);
      var detect = importer.detectHeaderRow(wiz.sampleAoa);
      wiz.headerRowIndex = detect.rowIndex;
      recomputeMapping();
    }

    function recomputeMapping() {
      var headerRow = wiz.sampleAoa[wiz.headerRowIndex] || [];
      wiz.mapping = importer.buildMapping(headerRow);
      recomputeExtraction();
    }

    function recomputeExtraction() {
      var ws = wiz.workbook.Sheets[wiz.sheetName];
      wiz.mergeSuggestions = importer.detectMergeFillSuggestions(ws, wiz.mapping, wiz.headerRowIndex);
      wiz.mergeDecisions = {};
      Object.keys(wiz.mergeSuggestions).forEach(function (c) { wiz.mergeDecisions[c] = true; });
      applyMergeDecisions();
    }

    function applyMergeDecisions() {
      var ws = wiz.workbook.Sheets[wiz.sheetName];
      var rows = importer.extractRows(ws, wiz.headerRowIndex, wiz.mapping);
      Object.keys(wiz.mergeDecisions).forEach(function (c) {
        if (!wiz.mergeDecisions[c]) return;
        var sugg = wiz.mergeSuggestions[c];
        var result = store.fillBlanks(rows, { column: sugg.fieldKey, direction: "down", mode: "blanksOnly", boundaryColumn: "book" });
        rows = result.rows;
      });
      wiz.extracted = rows;
      wiz.enumCoercions = [];
      ["budget", "shift", "dispense"].forEach(function (key) {
        var domain = cfg.DIMENSIONS[key];
        rows.forEach(function (row, rowIndex) {
          if (validate.isBlank(row[key])) return;
          var match = validate.closestEnumMatch(row[key], domain);
          if (match && match !== row[key]) {
            wiz.enumCoercions.push({ rowIndex: rowIndex, column: key, from: row[key], to: match });
            row[key] = match;
          }
        });
      });
      wiz.excludedRowIndexes = {};
      revalidate();
    }

    function revalidate() {
      var rows = wiz.extracted.filter(function (r, i) { return !wiz.excludedRowIndexes[i]; });
      wiz.validation = validate.validateDataset(rows, wiz.mapping);
      wiz.rowsForCommit = rows;
    }

    function renderSteps() {
      stepsHost.innerHTML = "";
      STEP_LABELS.forEach(function (label, i) {
        if (i === 0 && workbook.SheetNames.length <= 1) return;
        var pill = el("span", { class: "pill", "aria-pressed": wiz.step === i ? "true" : "false" }, [text((i + 1) + ". " + label)]);
        stepsHost.appendChild(pill);
      });
    }

    function goTo(step) { wiz.step = step; renderAll(); }

    function renderFooter() {
      footer.innerHTML = "";
      var minStep = workbook.SheetNames.length > 1 ? 0 : 1;
      var backBtn = el("button", { class: "btn btn--secondary" }, [text("رجوع")]);
      backBtn.disabled = wiz.step <= minStep;
      backBtn.addEventListener("click", function () { goTo(wiz.step - 1); });
      footer.appendChild(backBtn);

      if (wiz.step < 4) {
        var nextBtn = el("button", { class: "btn btn--primary" }, [text("التالي")]);
        nextBtn.addEventListener("click", function () { goTo(wiz.step + 1); });
        footer.appendChild(nextBtn);
      } else {
        var commitBtn = el("button", { class: "btn btn--primary" }, [text("استيراد " + wiz.rowsForCommit.length + " صف")]);
        commitBtn.disabled = !wiz.validation.canCommit;
        commitBtn.addEventListener("click", function () {
          var replace = window.confirm("هل تريد استبدال البيانات الحالية بالملف المستورد؟ اضغط إلغاء لإضافة الصفوف إلى البيانات الحالية.");
          var nextRows = replace ? wiz.rowsForCommit : store.getSourceRows().concat(wiz.rowsForCommit);
          store.setSourceRows(nextRows, replace ? "استبدال بالاستيراد" : "إضافة استيراد", true);
          showToast("تم استيراد " + wiz.validation.summary.validCount + " صف صالح، " + wiz.validation.summary.problemRowCount + " صف به مشكلة", false);
          removeDialog(overlay);
          state.view = "main";
          render();
        });
        footer.appendChild(commitBtn);
      }
    }

    function renderAll() {
      renderSteps();
      renderFooter();
      body.innerHTML = "";
      if (wiz.step === 0) renderSheetStep();
      else if (wiz.step === 1) renderHeaderStep();
      else if (wiz.step === 2) renderMappingStep();
      else if (wiz.step === 3) renderMergeStep();
      else renderReviewStep();
    }

    function renderSheetStep() {
      body.appendChild(el("div", { class: "fs-title" }, [text("اختر الورقة")]));
      var thumbs = importer.sheetThumbnails(wiz.workbook);
      var grid = el("div", { style: "display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:var(--sp-4); margin-top:var(--sp-4);" });
      thumbs.forEach(function (t) {
        var card = el("div", { class: "panel-2", style: "cursor:pointer; border-color:" + (t.name === wiz.sheetName ? "var(--ink)" : "var(--line)") + ";" });
        card.appendChild(el("div", { style: "font-weight:600;" }, [text(t.name)]));
        var table = el("table", { class: "fs-caption", style: "margin-top:var(--sp-2); width:100%;" });
        t.preview.slice(0, 4).forEach(function (r) {
          var tr = el("tr");
          (r || []).slice(0, 4).forEach(function (c) { tr.appendChild(el("td", { style: "padding:1px 4px; color:var(--text-soft);" }, [text(c === null || c === undefined ? "" : String(c).slice(0, 14))])); });
          table.appendChild(tr);
        });
        card.appendChild(table);
        card.addEventListener("click", function () {
          wiz.sheetName = t.name;
          initFromSheet();
          renderAll();
        });
        grid.appendChild(card);
      });
      body.appendChild(grid);
    }

    function renderHeaderStep() {
      if (!wiz.sampleAoa.length) initFromSheet();
      body.appendChild(el("div", { class: "fs-title" }, [text("أي صف يحتوي عناوين الأعمدة؟")]));
      body.appendChild(el("div", { class: "fs-caption text-soft" }, [text("انقر على الصف الصحيح إن لم يكن الاختيار التلقائي مطابقًا.")]));
      var table = el("table", { class: "fs-body", style: "margin-top:var(--sp-4); border-collapse:collapse; width:100%;" });
      wiz.sampleAoa.forEach(function (row, i) {
        var tr = el("tr", {
          style: "cursor:pointer; background:" + (i === wiz.headerRowIndex ? "var(--ink-wash)" : "transparent") + "; border-bottom:1px solid var(--line);"
        });
        tr.appendChild(el("td", { class: "fs-caption text-faint", style: "padding:var(--sp-1) var(--sp-2);" }, [text(String(i + 1))]));
        (row || []).slice(0, 8).forEach(function (c) {
          tr.appendChild(el("td", { style: "padding:var(--sp-1) var(--sp-2);" }, [text(c === null || c === undefined ? "" : String(c))]));
        });
        tr.addEventListener("click", function () { wiz.headerRowIndex = i; recomputeMapping(); renderAll(); });
        table.appendChild(tr);
      });
      body.appendChild(table);
    }

    function renderMappingStep() {
      body.appendChild(el("div", { class: "fs-title" }, [text("تحقّق من ربط الأعمدة")]));
      var missing = cfg.FIELDS.filter(function (f) { return f.required; }).filter(function (f) {
        return Object.keys(wiz.mapping).every(function (c) { return wiz.mapping[c] !== f.key; });
      });
      if (missing.length) {
        body.appendChild(el("div", { class: "fs-caption", style: "color:var(--err); margin:var(--sp-2) 0;" }, [
          text("أعمدة مطلوبة غير مربوطة: " + missing.map(function (f) { return f.header; }).join("، "))
        ]));
      }
      var headerRow = wiz.sampleAoa[wiz.headerRowIndex] || [];
      var table = el("table", { class: "fs-body", style: "margin-top:var(--sp-2); border-collapse:collapse; width:100%;" });
      var head = el("tr");
      head.appendChild(el("th", { class: "fs-caption text-soft", style: "text-align:start; padding:var(--sp-1) var(--sp-2);" }, [text("عمود الملف")]));
      head.appendChild(el("th", { class: "fs-caption text-soft", style: "text-align:start; padding:var(--sp-1) var(--sp-2);" }, [text("يُربط بـ")]));
      table.appendChild(head);
      headerRow.forEach(function (headerText, c) {
        if (headerText === null || headerText === undefined || String(headerText).trim() === "") return;
        var tr = el("tr", { style: "border-bottom:1px solid var(--line);" });
        tr.appendChild(el("td", { style: "padding:var(--sp-1) var(--sp-2);" }, [text(String(headerText))]));
        var select = el("select", { class: "select" });
        select.appendChild(el("option", { value: "" }, [text("— تجاهل —")]));
        cfg.FIELDS.forEach(function (f) {
          var opt = el("option", { value: f.key }, [text(f.header + (f.required ? " *" : ""))]);
          if (wiz.mapping[c] === f.key) opt.selected = true;
          select.appendChild(opt);
        });
        select.addEventListener("change", function () {
          wiz.mapping[c] = select.value || null;
          recomputeExtraction();
          renderAll();
        });
        var td = el("td", { style: "padding:var(--sp-1) var(--sp-2);" });
        td.appendChild(select);
        tr.appendChild(td);
        table.appendChild(tr);
      });
      body.appendChild(table);
    }

    function renderMergeStep() {
      body.appendChild(el("div", { class: "fs-title" }, [text("تعبئة الخلايا المدمجة")]));
      var colIdxs = Object.keys(wiz.mergeSuggestions);
      if (!colIdxs.length) {
        body.appendChild(el("div", { class: "fs-caption text-soft", style: "margin-top:var(--sp-2);" }, [text("لا توجد خلايا مدمجة تحتاج تعبئة في هذا الملف.")]));
        return;
      }
      body.appendChild(el("div", { class: "fs-caption text-soft" }, [text("اكتشفنا أعمدة بها خلايا مدمجة رأسيًا في مصدر إكسل. التعبئة تنسخ القيمة للأسفل حتى تغيّر الدفتر.")]));
      colIdxs.forEach(function (c) {
        var sugg = wiz.mergeSuggestions[c];
        var row = el("div", { class: "builder-row", style: "margin-top:var(--sp-2); justify-content:space-between;" });
        row.appendChild(el("div", {}, [text(cfg.COLUMN_LABELS[sugg.fieldKey] + " — " + sugg.ranges + " نطاق، " + sugg.blankCells + " خلية")]));
        var toggle = el("div", { class: "switch", role: "switch", tabindex: "0", "aria-checked": wiz.mergeDecisions[c] ? "true" : "false" }, [
          el("span", { class: "switch__track" }), el("span", {}, [text("تعبئة")])
        ]);
        toggle.addEventListener("click", function () {
          wiz.mergeDecisions[c] = !wiz.mergeDecisions[c];
          applyMergeDecisions();
          renderAll();
        });
        row.appendChild(toggle);
        body.appendChild(row);
      });
    }

    function applyGroupFix(group, action) {
      group.items.forEach(function (p) {
        if (p.rowIndex === null) return;
        var row = wiz.extracted[p.rowIndex];
        if (!row) return;
        if (action === "exclude-row") { wiz.excludedRowIndexes[p.rowIndex] = true; return; }
        if (action === "fill-down" || action === "fill-up") {
          var result = store.fillBlanks(wiz.extracted, { column: p.column, direction: action === "fill-down" ? "down" : "up", mode: "blanksOnly", boundaryColumn: "book" });
          wiz.extracted = result.rows;
        } else if (action === "set-zero") {
          row[p.column] = 0;
        } else if (action === "strip-non-numeric") {
          var stripped = norm.parseNumber(String(row.__raw[p.column]).replace(/[^\d.,٠-٩\u066B\u066C-]/g, ""));
          row[p.column] = stripped;
        } else if (action === "replace" && p.fix && p.fix.value) {
          row[p.column] = p.fix.value;
        } else if (action === "keep-one") {
          wiz.excludedRowIndexes[p.rowIndex] = true;
        }
      });
      revalidate();
      renderAll();
    }

    function renderReviewStep() {
      revalidate();
      var s = wiz.validation.summary;
      body.appendChild(el("div", { class: "fs-title" }, [text("مراجعة قبل الاستيراد")]));
      var summaryRow = el("div", { class: "row", style: "gap:var(--sp-4); margin:var(--sp-3) 0;" });
      summaryRow.appendChild(el("div", { class: "fs-body" }, [text(String(s.validCount) + " صف صالح")]));
      if (s.problemRowCount) summaryRow.appendChild(el("div", { class: "fs-body", style: "color:var(--err);" }, [text(String(s.problemRowCount) + " صف به مشكلة")]));
      if (Object.keys(wiz.excludedRowIndexes).length) summaryRow.appendChild(el("div", { class: "fs-caption text-soft" }, [text(Object.keys(wiz.excludedRowIndexes).length + " صف مستبعد")]));
      if (wiz.enumCoercions.length) summaryRow.appendChild(el("div", { class: "fs-caption", style: "color:var(--ok);" }, [text("طُبِّقت " + wiz.enumCoercions.length + " تصحيحات تلقائية للقيم المعروفة")]));
      body.appendChild(summaryRow);

      var groups = validate.groupRepeats(wiz.validation.problems);
      if (!groups.length) {
        body.appendChild(el("div", { class: "fs-caption text-soft" }, [text("لا توجد مشاكل — جاهز للاستيراد.")]));
      }
      groups.forEach(function (g) {
        var sevColor = g.severity === "blocker" || g.severity === "error" ? "var(--err)" : (g.severity === "warning" ? "var(--brass)" : "var(--text-soft)");
        var row = el("div", { class: "builder-row", style: "margin-top:var(--sp-2); justify-content:space-between; border-inline-start:2px solid " + sevColor + ";" });
        row.appendChild(el("div", {}, [text(g.count + "× — " + g.sample.message)]));
        var actions = el("div", { class: "row", style: "gap:var(--sp-1);" });
        if (g.sample.fix && g.sample.fix.type === "choice") {
          g.sample.fix.options.forEach(function (opt) {
            var label = { "fill-down": "تعبئة من الأعلى", "fill-up": "تعبئة من الأسفل", "exclude-row": "استبعاد الصفوف", "set-zero": "تصفير القيمة", "keep-one": "الاحتفاظ بواحد فقط", "keep-both": "الاحتفاظ بالكل" }[opt] || opt;
            var btn = el("button", { class: "btn btn--secondary" }, [text(label)]);
            btn.addEventListener("click", function () { applyGroupFix(g, opt); });
            actions.appendChild(btn);
          });
        } else if (g.sample.fix && g.sample.fix.type === "replace") {
          var btn2 = el("button", { class: "btn btn--secondary" }, [text("استبدال بـ \"" + g.sample.fix.value + "\" للكل")]);
          btn2.addEventListener("click", function () { applyGroupFix(g, "replace"); });
          actions.appendChild(btn2);
        } else if (g.sample.fix && g.sample.fix.type === "strip-non-numeric") {
          var btn3 = el("button", { class: "btn btn--secondary" }, [text("إزالة الأحرف غير الرقمية")]);
          btn3.addEventListener("click", function () { applyGroupFix(g, "strip-non-numeric"); });
          actions.appendChild(btn3);
        } else if (g.sample.fix && g.sample.fix.type === "scroll-to-mapping") {
          var btn4 = el("button", { class: "btn btn--secondary" }, [text("الذهاب إلى ربط الأعمدة")]);
          btn4.addEventListener("click", function () { goTo(2); });
          actions.appendChild(btn4);
        }
        row.appendChild(actions);
        body.appendChild(row);
      });
    }

    initFromSheet();
    renderAll();
  }

  function startImportFlow(workbook) {
    openImportWizard(workbook);
  }

  function loadSampleData() {
    if (store.getSourceRows().length && !window.confirm("سيؤدي تحميل البيانات التجريبية إلى استبدال البيانات الحالية. هل تريد المتابعة؟")) return;
    var source = (window.PH_FIXTURES && window.PH_FIXTURES.source) || PH.selftest.generateFixtureSource(20260701, 40);
    store.setSourceRows(source.slice(0, 40), "تحميل بيانات تجريبية", true);
    render();
  }

  function render() {
    renderReportTabs($("report-tabs"));
    renderScopeBar($("scope-bar"));
    renderMain($("main-content"));
    var hasData = store.getSourceRows().length > 0;
    var importBtn = $("btn-import");
    var printBtn = $("btn-print");
    if (importBtn) importBtn.style.display = hasData ? "none" : "";
    if (printBtn) printBtn.style.display = hasData ? "" : "none";
    var saveEl = $("save-state");
    if (saveEl) {
      var s = store.getSaveState();
      saveEl.textContent = s === "saved" ? "تم الحفظ" : (s === "pending" ? "جارِ الحفظ…" : (s === "error" ? "تعذّر الحفظ — صدّر نسخة احتياطية" : ""));
      saveEl.style.color = s === "error" ? "var(--err)" : "";
    }
  }

  function bindKeyboard() {
    document.addEventListener("keydown", function (e) {
      if ((e.key === "Enter" || e.key === " ") && e.target && e.target.getAttribute("role") === "switch") {
        e.preventDefault();
        e.target.click();
      }
    });
    document.addEventListener("keydown", function (e) {
      var ctrl = e.ctrlKey || e.metaKey;
      var target = e.target;
      if (e.key === "Escape") {
        var dialogs = document.querySelectorAll('[role="dialog"]');
        if (dialogs.length) { e.preventDefault(); dialogs[dialogs.length - 1].remove(); if (dialogs.length === 1) document.body.classList.remove("modal-open"); return; }
        if (overflowMenuOpen) { e.preventDefault(); closeOverflowMenu(); var t = $("btn-overflow-toggle"); if (t) t.focus(); return; }
      }
      var editable = target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.tagName === "SELECT" || target.isContentEditable);
      if (ctrl && e.key.toLowerCase() === "k") { e.preventDefault(); openCommandPalette(); return; }
      if (editable) return;
      if (ctrl && e.key.toLowerCase() === "f") {
        var search = document.querySelector('.main__toolbar input[placeholder^="بحث"]');
        if (search) { e.preventDefault(); search.focus(); search.select(); }
        return;
      }
      if (ctrl && e.key === "z") { e.preventDefault(); var l = store.undo(); if (l) { render(); showToast("تراجع: " + l); } }
      else if (ctrl && e.key === "y") { e.preventDefault(); var l2 = store.redo(); if (l2) { render(); showToast("إعادة: " + l2); } }
      else if (ctrl && /^[1-8]$/.test(e.key)) {
        e.preventDefault();
        var rep = cfg.REPORTS.filter(function (r) { return r.shortcut === e.key; })[0];
        if (rep) { if (state.activeReportId !== rep.id) resetQueryState(); state.activeReportId = rep.id; render(); }
      } else if (ctrl && e.key === "p") { e.preventDefault(); openPrintPreview(); }
      else if (ctrl && e.key === "e") { e.preventDefault(); runExport(); }
      else if (ctrl && e.shiftKey && (e.key === "t" || e.key === "T")) { e.preventDefault(); runSelfTestOverlay(); }
    });
  }

  function isViewFiltered() {
    return state.queryState.filters.length > 0 || !!state.queryState.searchText || state.queryState.sortLevels.length > 0;
  }

  function outputRowsFor(sheet, repDef) {
    if (!state.applyToPrintExport || !isViewFiltered()) return sheet.rows;
    var textCols = repDef.columns.filter(function (c) { return !cfg.MONEY_COLUMNS[c] && c !== "pageNo" && c !== "printPageNo"; });
    var pipeline = query.runPipeline(sheet.rows, state.queryState, textCols, columnTypesFor(repDef.columns));
    return pipeline.sorted;
  }

  function activeScopeSuffix() {
    var parts = cfg.DIMENSION_ORDER.map(function (dim) { return reports.dimLabel(state.activeCombination, dim); })
      .filter(function (label, i) { return label !== "الكل"; });
    if (state.activeMonth) parts.push("الشهر: " + state.activeMonth);
    return parts.length ? " — " + parts.join(" · ") : "";
  }

  function openPrintPreview() {
    var sheet = computeActiveSheet();
    var repDef = cfg.REPORTS_BY_ID[state.activeReportId];
    var settings = resolveSettings(state.activeReportId, sheetKeyFor(state.activeReportId, state.activeCombination));
    var outputRows = outputRowsFor(sheet, repDef);
    // Single source of truth for "did the active filter actually change what's being
    // printed" - drives both the header label suffix and the print footer marker, so
    // the two can no longer disagree with each other.
    var didApplyView = outputRows !== sheet.rows;
    var reportLabel = repDef.label + activeScopeSuffix() + (didApplyView ? " (مصفّى)" : "");
    var orientation = "portrait";
    var calibration = { offsetTopMm: 0, offsetBottomMm: 0, offsetInnerMm: 0, offsetOuterMm: 0, scalePercent: 0 };
    var showingRuler = false;

    var overlay = el("div", { role: "dialog", "aria-modal": "true", "aria-label": "معاينة الطباعة", style: "position:fixed; inset:0; background:var(--paper-sunken); z-index:50; display:flex; flex-direction:column;" });
    var toolbar = el("div", { class: "print-preview-toolbar" }, [
      el("button", { class: "btn btn--secondary" }, [text("إغلاق")]),
      el("button", { class: "btn btn--tertiary" }, [text("⚙ معايرة الطباعة")]),
      el("button", { class: "btn btn--tertiary" }, [text("الاتجاه: رأسي")]),
      el("button", { class: "btn btn--primary" }, [text("طباعة")])
    ]);
    var closeBtn = toolbar.children[0];
    var calibrateBtn = toolbar.children[1];
    var orientationBtn = toolbar.children[2];
    var printBtn = toolbar.children[3];

    var body = el("div", { style: "flex:1; display:flex; overflow:hidden;" });
    var previewContainer = el("div", { style: "flex:1; overflow:auto;" });
    var calPanel = el("div", { class: "panel-2", style: "width:280px; margin:var(--sp-4); display:none; flex-direction:column; gap:var(--sp-3); overflow:auto;" });
    body.appendChild(previewContainer);
    body.appendChild(calPanel);
    overlay.appendChild(toolbar);
    overlay.appendChild(body);
    document.body.appendChild(overlay);
    document.body.classList.add("modal-open");

    function refreshPreview() {
      if (showingRuler) {
        previewContainer.innerHTML = "";
        var shell = el("div", { class: "print-preview-shell" });
        shell.appendChild(PH.print.buildCalibrationRulerPage(calibration, orientation));
        previewContainer.appendChild(shell);
      } else {
        PH.print.renderPreview(previewContainer, outputRows, { rowsPerPage: settings.rowsPerPage || 24, columns: repDef.columns, reportLabel: reportLabel, orientation: orientation, calibration: calibration, isFiltered: didApplyView, hasFilledMoney: outputRows.some(function (r) { return r.__filled; }), printTotalField: repDef.printTotalField });
      }
    }

    function persistCalibration() {
      store.saveCalibrationProfile("default", calibration);
    }

    function numField(labelText, key, min, max, step) {
      var input = el("input", { class: "input", type: "number", min: String(min), max: String(max), step: String(step), style: "width:100%;" });
      input.value = calibration[key];
      input.addEventListener("change", function () {
        var v = parseFloat(input.value);
        if (isNaN(v)) v = 0;
        v = Math.max(min, Math.min(max, v));
        input.value = v;
        calibration[key] = v;
        persistCalibration();
        refreshPreview();
      });
      return el("div", { class: "field" }, [el("label", {}, [text(labelText)]), input]);
    }

    function buildCalPanel() {
      calPanel.innerHTML = "";
      calPanel.appendChild(el("div", { class: "fs-body", style: "font-weight:600;" }, [text("معايرة الطباعة")]));
      calPanel.appendChild(el("div", { class: "fs-caption text-soft" }, [text("اطبع صفحة المعايرة، قِس الهامش الفعلي بمسطرة، ثم عدّل القيم هنا حتى يطابق التصميم المطبوع.")]));
      calPanel.appendChild(numField("إزاحة الهامش العلوي (مم)", "offsetTopMm", -15, 15, 0.5));
      calPanel.appendChild(numField("إزاحة الهامش السفلي (مم)", "offsetBottomMm", -15, 15, 0.5));
      calPanel.appendChild(numField("إزاحة الهامش الداخلي (مم)", "offsetInnerMm", -15, 15, 0.5));
      calPanel.appendChild(numField("إزاحة الهامش الخارجي (مم)", "offsetOuterMm", -15, 15, 0.5));
      calPanel.appendChild(numField("تصحيح المقياس (%)", "scalePercent", -5, 5, 0.5));

      var geo = PH.print.resolveGeo(PH.print.DEFAULT_GEO, calibration);
      var assertion = PH.paginate.assertGeometry(Object.assign({ rowsPerPage: settings.rowsPerPage || 24, orientation: orientation }, geo));
      if (!assertion.ok) {
        calPanel.appendChild(el("div", { class: "fs-caption", style: "color:var(--err);" }, [text("القيم الحالية تجعل الصفحة غير قابلة للطباعة: " + assertion.errors.join("، "))]));
      }

      var rulerBtn = el("button", { class: "btn btn--secondary" }, [text(showingRuler ? "عرض المعاينة العادية" : "معاينة صفحة المعايرة")]);
      rulerBtn.addEventListener("click", function () { showingRuler = !showingRuler; refreshPreview(); buildCalPanel(); });
      calPanel.appendChild(rulerBtn);

      var resetBtn = el("button", { class: "btn btn--tertiary" }, [text("إعادة الضبط للافتراضي")]);
      resetBtn.addEventListener("click", function () {
        calibration = { offsetTopMm: 0, offsetBottomMm: 0, offsetInnerMm: 0, offsetOuterMm: 0, scalePercent: 0 };
        persistCalibration();
        refreshPreview();
        buildCalPanel();
      });
      calPanel.appendChild(resetBtn);
    }

    closeBtn.addEventListener("click", function () { removeDialog(overlay); });
    calibrateBtn.addEventListener("click", function () {
      var isOpen = calPanel.style.display !== "none";
      calPanel.style.display = isOpen ? "none" : "flex";
    });
    orientationBtn.addEventListener("click", function () {
      orientation = orientation === "portrait" ? "landscape" : "portrait";
      orientationBtn.textContent = orientation === "portrait" ? "الاتجاه: رأسي" : "الاتجاه: أفقي";
      refreshPreview();
      if (calPanel.style.display !== "none") buildCalPanel();
    });
    printBtn.addEventListener("click", function () {
      PH.print.runPrintJob(outputRows, { rowsPerPage: settings.rowsPerPage || 24, columns: repDef.columns, reportLabel: reportLabel, orientation: orientation, calibration: calibration, isFiltered: didApplyView, hasFilledMoney: outputRows.some(function (r) { return r.__filled; }), printTotalField: repDef.printTotalField });
    });

    store.loadCalibrationProfiles().then(function (profiles) {
      if (profiles && profiles["default"]) calibration = Object.assign({ offsetTopMm: 0, offsetBottomMm: 0, offsetInnerMm: 0, offsetOuterMm: 0, scalePercent: 0 }, profiles["default"]);
      buildCalPanel();
      refreshPreview();
    }).catch(function () {
      buildCalPanel();
      refreshPreview();
    });
  }

  function runExport() {
    var sheet = computeActiveSheet();
    var repDef = cfg.REPORTS_BY_ID[state.activeReportId];
    var outputRows = outputRowsFor(sheet, repDef);
    var monthValues = store.getSourceRows().map(function (r) { return r.month; }).filter(function (v, i, a) { return v && a.indexOf(v) === i; });
    var exportMonth = monthValues.length === 1 ? monthValues[0] : (monthValues.length ? "متعدد" : "غير-محدد");
    var name = PH.exporter.exportSingleWorkbook(
      [{ rows: outputRows, columns: repDef.columns, combination: state.activeCombination }],
      { month: exportMonth, reportId: state.activeReportId }
    );
    showToast("تم تصدير " + name);
  }

  function runZipExport() {
    var reportId = state.activeReportId;
    if (reportId === "pages") {
      showToast("تقرير الصفحات يجمع كل الشرائح بالفعل — استخدم زر التصدير العادي.", false);
      return;
    }
    var repDef = cfg.REPORTS_BY_ID[reportId];
    var rows = store.getSourceRows();
    var combos = matrix.nonEmpty(matrix.materialize(rows, state.dimensionGroups));
    if (combos.length < 2) {
      showToast("لا توجد إلا شريحة واحدة لهذا التقرير.", false);
      return;
    }
    var sheets = combos.map(function (m) {
      var sheet = computeSheetFor(reportId, m.combination);
      return { rows: sheet.rows, columns: repDef.columns, combination: m.combination };
    });
    var monthValues = rows.map(function (r) { return r.month; }).filter(function (v, i, a) { return v && a.indexOf(v) === i; });
    var exportMonth = monthValues.length === 1 ? monthValues[0] : (monthValues.length ? "متعدد" : "غير-محدد");
    var progress = el("div", { class: "panel-2", style: "position:fixed; inset-inline-start:50%; top:50%; transform:translate(-50%,-50%); z-index:90; width:320px;" }, [
      el("div", { class: "fs-body" }, [text("جارٍ تجهيز ملف ZIP…")]),
      el("div", { class: "progress-bar", style: "margin-top:var(--sp-3);" }, [el("div", { class: "progress-bar__fill", style: "width:0%;" })]),
      el("div", { class: "fs-caption text-soft", style: "margin-top:var(--sp-2);" }, [text("0 / " + sheets.length)])
    ]);
    document.body.appendChild(progress);
    var fill = progress.querySelector(".progress-bar__fill");
    var caption = progress.querySelector(".fs-caption");
    PH.exporter.exportZipPerSheet(sheets, { month: exportMonth, reportId: reportId, onProgress: function (done, total, percent) {
      var pct = percent !== undefined ? percent : (total ? done / total * 100 : 0);
      fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
      caption.textContent = percent !== undefined && done === total ? "ضغط الملف…" : done + " / " + total;
    } }).then(function (zipName) {
      progress.remove();
      showToast("تم تصدير " + zipName);
    }).catch(function (err) {
      progress.remove();
      showToast("تعذّر تصدير ZIP: " + (err && err.message ? err.message : "خطأ غير معروف"), false);
    });
  }

  function runSelfTestOverlay() {
    var overlay = el("div", { role: "dialog", "aria-modal": "true", "aria-label": "الفحص الذاتي", style: "position:fixed; inset:0; background:var(--paper); z-index:100; padding:var(--sp-6); overflow:auto;" });
    overlay.appendChild(el("div", { class: "fs-title" }, [text("فحص ذاتي — جارٍ التشغيل…")]));
    document.body.appendChild(overlay);
    document.body.classList.add("modal-open");
    PH.selftest.runAll().then(function (result) {
      overlay.innerHTML = "";
      overlay.appendChild(el("div", { class: "fs-title" }, [text("نتائج الفحص الذاتي")]));
      overlay.appendChild(el("div", { class: "fs-body" }, [text("نجاح: " + result.totalPass + "   ·   فشل: " + result.totalFail)]));
      if (result.failures.length) {
        var list = el("ul", { style: "list-style:disc; padding-inline-start:20px;" });
        result.failures.forEach(function (f) { list.appendChild(el("li", { class: "fs-caption" }, [text(f)])); });
        overlay.appendChild(list);
      }
      var closeBtn = el("button", { class: "btn btn--secondary", style: "margin-top:var(--sp-4);" }, [text("إغلاق")]);
      closeBtn.addEventListener("click", function () { removeDialog(overlay); });
      overlay.appendChild(closeBtn);
    });
  }

  function init() {
    if (!window.XLSX) showToast("مكتبة Excel غير متاحة — الاستيراد والتصدير يحتاجان اتصالًا أو نسخة محلية.", false);
    if (!window.JSZip) showToast("مكتبة ZIP غير متاحة — تصدير الكل لن يعمل حتى تُحمّل المكتبة.", false);
    Promise.all([store.loadPersisted(), store.getAllSettingsScopes()]).then(function (results) {
      var scopes = results[1];
      state.settingsOverrides.global = scopes.global;
      state.settingsOverrides.report = scopes.report;
      state.settingsOverrides.sheet = scopes.sheet;
      state.settingsOverrides.linked = scopes.linked;
      render();
    }).catch(function () {
      render();
    });
    bindKeyboard();
    bindPaste();
    ensureScopeClickAwayListener();
    bindOverflowMenu();
    var paletteTrigger = $("btn-palette-trigger");
    if (paletteTrigger) paletteTrigger.addEventListener("click", openCommandPalette);
    store.onChange(function () { render(); });
    document.addEventListener("ph-import-file", function (e) { startImportFlow(e.detail); });
    document.getElementById("btn-add").addEventListener("click", openGuidedFormOverlay);
    if (/[?&]selftest=1/.test(window.location.search)) runSelfTestOverlay();
  }

  function openGuidedFormOverlay() {
    var overlay = el("div", { role: "dialog", "aria-modal": "true", "aria-label": "إضافة صف", style: "position:fixed; inset-inline-end:0; top:52px; bottom:0; z-index:40; padding:var(--sp-4); overflow:auto; background:var(--paper);" });
    var closeBtn = el("button", { class: "btn btn--tertiary" }, [text("إغلاق ✕")]);
    closeBtn.addEventListener("click", function () { removeDialog(overlay); });
    overlay.appendChild(closeBtn);
    PH.viewEntry.createGuidedForm(overlay, {
      onCommit: function () { showToast("تمت الإضافة"); }
    });
    document.body.appendChild(overlay);
    document.body.classList.add("modal-open");
  }

  function downloadTemplate() {
    try {
      var name = PH.exporter.exportImportTemplate();
      showToast("تم تحميل " + name);
    } catch (e) {
      showToast("تعذّر إنشاء النموذج", false);
    }
  }

  function exportWorkspaceBackup() {
    var payload = {
      format: "daftar-workspace",
      version: 1,
      exportedAt: new Date().toISOString(),
      rows: store.getSourceRows(),
      settingsOverrides: state.settingsOverrides,
      activeMonth: state.activeMonth,
      activeReportId: state.activeReportId,
      dimensionGroups: state.dimensionGroups
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "daftar-workspace-backup.json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast("تم حفظ النسخة الاحتياطية");
  }

  function restoreWorkspaceBackup(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var payload = JSON.parse(String(reader.result || ""));
        if (!payload || payload.format !== "daftar-workspace" || !Array.isArray(payload.rows)) throw new Error("صيغة نسخة غير معروفة");
        if (!window.confirm("سيؤدي الاستعادة إلى استبدال البيانات الحالية. هل تريد المتابعة؟")) return;
        store.setSourceRows(payload.rows, "استعادة نسخة احتياطية", true);
        if (payload.settingsOverrides) state.settingsOverrides = Object.assign({ global: {}, report: {}, sheet: {}, linked: {} }, payload.settingsOverrides);
        if (payload.activeMonth !== undefined) state.activeMonth = payload.activeMonth;
        if (payload.activeReportId && cfg.REPORTS_BY_ID[payload.activeReportId]) state.activeReportId = payload.activeReportId;
        if (payload.dimensionGroups) state.dimensionGroups = payload.dimensionGroups;
        render();
        showToast("تمت استعادة النسخة الاحتياطية");
      } catch (err) {
        showToast("تعذّرت استعادة النسخة: " + (err && err.message ? err.message : "ملف غير صالح"), false);
      }
    };
    reader.readAsText(file, "utf-8");
  }

  return { init: init, state: state, computeActiveSheet: computeActiveSheet, render: render, decodeTextBuffer: decodeTextBuffer, downloadTemplate: downloadTemplate, exportWorkspaceBackup: exportWorkspaceBackup, restoreWorkspaceBackup: restoreWorkspaceBackup };
})();

document.addEventListener("DOMContentLoaded", function () { PH.app.init(); });

</script>
<script>
document.getElementById("btn-export").addEventListener("click", function () {
  if (window.PH && PH.app) {
    var evt = new KeyboardEvent("keydown", { key: "e", ctrlKey: true });
    document.dispatchEvent(evt);
  }
});
document.getElementById("btn-print").addEventListener("click", function () {
  var evt = new KeyboardEvent("keydown", { key: "p", ctrlKey: true });
  document.dispatchEvent(evt);
});
document.getElementById("btn-selftest").addEventListener("click", function () {
  var evt = new KeyboardEvent("keydown", { key: "T", ctrlKey: true, shiftKey: true });
  document.dispatchEvent(evt);
});
document.getElementById("btn-template").addEventListener("click", function () {
  if (window.PH && PH.app) PH.app.downloadTemplate();
});
document.getElementById("btn-backup").addEventListener("click", function () {
  if (window.PH && PH.app) PH.app.exportWorkspaceBackup();
});
document.getElementById("btn-restore").addEventListener("click", function () {
  var input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,application/json";
  input.addEventListener("change", function () {
    if (input.files.length && window.PH && PH.app) PH.app.restoreWorkspaceBackup(input.files[0]);
  });
  input.click();
});
document.getElementById("btn-theme").addEventListener("click", function () {
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("daftar-theme", next); } catch (e) {}
});
document.getElementById("btn-import").addEventListener("click", function () {
  var input = document.createElement("input");
  input.type = "file";
  input.accept = ".xlsx,.xls,.xlsm,.csv";
  input.addEventListener("change", function () {
    if (input.files.length && window.PH && PH.app) {
      var reader = new FileReader();
      var file = input.files[0];
      var ext = PH.importer.fileExtensionOf(file.name);
      reader.onload = function () {
        try {
          var csvText = PH.app.decodeTextBuffer(reader.result);
          var delimiter = csvText.indexOf("\t") !== -1 ? "\t" : (csvText.indexOf(";") !== -1 ? ";" : ",");
          var wb = ext === "csv" ? PH.importer.readWorkbookFromText(csvText, delimiter) : PH.importer.readWorkbookFromArrayBuffer(reader.result);
          PH.app.state.pendingImport = wb;
          document.dispatchEvent(new CustomEvent("ph-import-file", { detail: wb }));
        } catch (err) {
          alert("تعذّرت قراءة الملف: " + (err && err.message ? err.message : "ملف غير صالح"));
        }
      };
      reader.readAsArrayBuffer(file);
    }
  });
  input.click();
});

try {
  var savedTheme = localStorage.getItem("daftar-theme");
  if (savedTheme === "dark" || savedTheme === "light") document.documentElement.setAttribute("data-theme", savedTheme);
} catch (e) {}

</script>
</body>
</html>
