<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر — تقارير الصيدلية</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%231F6F5C'/%3E%3Crect x='5.25' y='4' width='14.5' height='16.5' rx='1.5' fill='none' stroke='%23F7FDFB' stroke-width='1.4'/%3E%3Cpath d='M8.25 4V20.5' stroke='%23F7FDFB' stroke-width='1.4'/%3E%3Cpath d='M11 8.75H15.25' stroke='%23F7FDFB' stroke-width='1.3' stroke-linecap='round'/%3E%3Cpath d='M11 11.75H15.25' stroke='%23F7FDFB' stroke-width='1.3' stroke-linecap='round'/%3E%3Cpath d='M11 14.75H13.5' stroke='%23F7FDFB' stroke-width='1.3' stroke-linecap='round'/%3E%3Cpath d='M14.5 4V8.25L16 7.1L17.5 8.25V4Z' fill='%23A8763E'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --paper: #F7F4EE;
  --paper-raised: #FDFBF7;
  --paper-sunken: #EFEAE1;
  --line: #E3DCCF;
  --line-strong: #C9BFAC;

  --text: #2B2A26;
  --text-soft: #6B675E;
  --text-faint: #9B968A;

  --ink: #1F6F5C;
  --ink-hover: #185848;
  --ink-wash: #E4EFEA;
  --ink-on: #F7FDFB;

  --brass: #A8763E;
  --brass-wash: #F4EBDD;

  --ok: #3D7A46;
  --ok-wash: #E6F0E4;
  --warn: #9A6B1F;
  --warn-wash: #F6EEDA;
  --err: #A8453A;
  --err-wash: #F5E4E1;

  --font-ui: "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, monospace;

  --fs-display: 22px;
  --fs-title: 16px;
  --fs-body: 14px;
  --fs-strong: 14px;
  --fs-caption: 12.5px;

  --r-outer: 16px;
  --r-mid: 10px;
  --r-inner: 6px;
  --r-round: 999px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  --control-h: 36px;
  --control-h-lg: 44px;
  --row-h: 40px;

  --shadow-2: 0 8px 24px rgba(43, 42, 38, .10);
  --motion-fast: 150ms ease-out;
  --motion-panel: 200ms ease-out;
  --motion-toast: 250ms ease-out;
}

:root[data-theme="dark"] {
  --paper: #201F1B;
  --paper-raised: #282722;
  --paper-sunken: #1A1916;
  --line: #3A382F;
  --line-strong: #4E4B3F;

  --text: #E9E5DB;
  --text-soft: #A7A294;
  --text-faint: #6E6A5E;

  --ink: #4FA98D;
  --ink-hover: #63BBA0;
  --ink-wash: #24352F;
  --ink-on: #10201B;

  --brass: #C79A62;
  --brass-wash: #332B1F;

  --ok: #6FAE76;
  --ok-wash: #24301F;
  --warn: #C9964B;
  --warn-wash: #332B18;
  --err: #C96B5E;
  --err-wash: #33211D;

  --shadow-2: 0 8px 24px rgba(0, 0, 0, .35);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --motion-fast: 1ms linear;
    --motion-panel: 1ms linear;
    --motion-toast: 1ms linear;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }

body {
  direction: rtl;
  font-family: var(--font-ui);
  font-size: var(--fs-body);
  font-weight: 400;
  line-height: 1.6;
  color: var(--text);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p, dl, dd { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
a { color: inherit; text-decoration: none; }

table { border-collapse: collapse; width: 100%; }

.num, [data-num], .cell-num {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  unicode-bidi: isolate;
}

.page-cell--num { unicode-bidi: isolate; }

.fs-display { font-size: var(--fs-display); font-weight: 600; }
.fs-title { font-size: var(--fs-title); font-weight: 600; }
.fs-body { font-size: var(--fs-body); font-weight: 400; }
.fs-strong { font-size: var(--fs-body); font-weight: 600; }
.fs-caption { font-size: var(--fs-caption); font-weight: 400; }

.text-soft { color: var(--text-soft); }
.text-faint { color: var(--text-faint); }
.money { color: var(--brass); font-weight: 600; }

:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
  border-color: var(--ink) !important;
  box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink);
}

@media (forced-colors: active) {
  :focus-visible { outline: 2px solid Highlight; box-shadow: none; }
}

*, *::before, *::after {
  transition-property: background-color, border-color, color, transform, box-shadow, opacity;
  transition-duration: var(--motion-fast);
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: var(--r-round); }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}


.app-shell {
  display: grid;
  grid-template-rows: 52px 44px 1fr;
  grid-template-columns: 1fr;
  grid-template-areas: "titlebar" "reporttabs" "main";
  height: 100vh;
  background: var(--paper);
}

.title-bar {
  grid-area: titlebar;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 0 var(--sp-4);
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}

.title-bar__mark {
  width: 28px;
  height: 28px;
  border-radius: var(--r-inner);
  background: var(--ink-wash);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}

.title-bar__name {
  font-size: var(--fs-title);
  font-weight: 600;
}

.title-bar__spacer { flex: 1; }

.title-bar__save-state {
  font-size: var(--fs-caption);
  color: var(--text-soft);
  display: flex;
  align-items: center;
  gap: var(--sp-1);
}

.rail {
  grid-area: rail;
  border-inline-end: 1px solid var(--line);
  background: var(--paper);
  overflow-y: auto;
  padding: var(--sp-4) var(--sp-2);
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.rail__section-label {
  font-size: var(--fs-caption);
  color: var(--text-faint);
  padding: var(--sp-2) var(--sp-3);
  text-transform: none;
}

.report-tab {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-mid);
  color: var(--text-soft);
  font-size: var(--fs-body);
}

.report-tab:hover { background: var(--paper-sunken); }

.report-tab[aria-selected="true"] {
  background: var(--ink-wash);
  color: var(--ink);
  font-weight: 600;
}

.report-tab[aria-selected="true"]::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: 6px;
  bottom: 6px;
  width: 3px;
  border-radius: var(--r-round);
  background: var(--ink);
}

.report-tab[aria-disabled="true"] {
  color: var(--text-faint);
  pointer-events: none;
}

.combo-list {
  padding: 0 var(--sp-3) var(--sp-2);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.combo-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--fs-caption);
  color: var(--text-soft);
  padding: 3px var(--sp-2);
  border-radius: var(--r-inner);
}

.combo-item:hover { background: var(--paper-sunken); }
.combo-item[aria-selected="true"] { background: var(--paper-sunken); color: var(--text); }
.combo-item[data-empty="true"] { color: var(--text-faint); }

.report-tabs {
  grid-area: reporttabs;
  display: flex;
  align-items: stretch;
  gap: var(--sp-1);
  padding: 0 var(--sp-6);
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}

.report-tab-h {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-3);
  color: var(--text-soft);
  font-size: var(--fs-body);
  white-space: nowrap;
  border-bottom: 2px solid transparent;
}

.report-tab-h:hover { color: var(--text); background: var(--paper-sunken); }

.report-tab-h[aria-selected="true"] {
  color: var(--ink);
  font-weight: 600;
  border-bottom-color: var(--ink);
}

.report-tab-h[aria-disabled="true"] {
  color: var(--text-faint);
  cursor: help;
}

.report-tab-h__shortcut {
  font-size: var(--fs-caption);
  color: var(--text-faint);
}

.detail-tree {
  padding: var(--sp-2);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.detail-node {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  font-size: var(--fs-caption);
  color: var(--text-soft);
  padding: var(--sp-2) var(--sp-2);
  border-radius: var(--r-inner);
  cursor: pointer;
}

.detail-node:hover { background: var(--paper-sunken); }
.detail-node[aria-selected="true"] { background: var(--ink-wash); color: var(--ink); font-weight: 600; }
.detail-node[data-empty="true"] { color: var(--text-faint); }

.detail-node__chevron {
  display: inline-flex;
  width: 14px;
  height: 14px;
  align-items: center;
  justify-content: center;
  transition: transform 120ms ease;
  flex: none;
  color: var(--text-faint);
}

.detail-node__chevron[data-open="true"] { transform: rotate(90deg); }

.detail-node__label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

.detail-children {
  padding-inline-start: var(--sp-5);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.scope-breadcrumb {
  font-size: var(--fs-caption);
  color: var(--text-faint);
}

.main {
  grid-area: main;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.main__scope-bar {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-6);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}

.main__toolbar {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-6);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
  position: relative;
}

.main__content {
  flex: 1;
  overflow: auto;
  padding: var(--sp-6);
}

.card {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: var(--r-outer);
  padding: var(--sp-6);
}

.card + .card { margin-top: var(--sp-4); }

.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
.row { display: flex; align-items: center; gap: var(--sp-2); }
.row--wrap { flex-wrap: wrap; }
.spacer { flex: 1; }

@media print {
  .app-shell, .title-bar, .report-tabs, .main__scope-bar, .main__toolbar { display: none !important; }
}

@media (max-width: 1100px) {
  .main__scope-bar, .main__toolbar, .main__content { padding-inline: var(--sp-3); }
  .title-bar { padding-inline: var(--sp-3); }
  #toolbar-actions { gap: var(--sp-1); overflow-x: auto; }
  #toolbar-actions .btn { padding-inline: var(--sp-2); }
}

@media (max-width: 760px) {
  .title-bar { min-height: auto; flex-wrap: wrap; gap: var(--sp-2); }
  .title-bar__spacer { display: none; }
  .title-bar__save-state { margin-inline-start: auto; }
  .report-tabs { overflow-x: auto; }
  .card { padding: var(--sp-3); }
}

body.modal-open { overflow: hidden; }


.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  height: var(--control-h);
  padding: 0 var(--sp-4);
  border-radius: var(--r-mid);
  font-size: var(--fs-body);
  font-weight: 600;
  white-space: nowrap;
}

.btn--primary { background: var(--ink); color: var(--ink-on); }
.btn--primary:hover { background: var(--ink-hover); }
.btn--primary:active { transform: translateY(0.5px); }
.btn--primary:disabled { opacity: .5; pointer-events: none; }

.btn--secondary { background: transparent; color: var(--text); border: 1px solid var(--line-strong); }
.btn--secondary:hover { background: var(--paper-sunken); }
.btn--secondary:active { transform: translateY(0.5px); }
.btn--secondary:disabled { opacity: .5; pointer-events: none; }

.btn--tertiary { background: transparent; color: var(--ink); font-weight: 600; height: auto; padding: var(--sp-1) var(--sp-2); }
.btn--tertiary:hover { background: var(--ink-wash); border-radius: var(--r-inner); }
.btn--tertiary:active { transform: translateY(0.5px); }
.btn--tertiary:disabled { opacity: .5; pointer-events: none; }

.btn--ghost { background: transparent; color: var(--text-soft); border: 1px solid var(--line-strong); font-weight: 500; }
.btn--ghost:hover { background: var(--paper-sunken); color: var(--text); }
.btn--ghost:active { transform: translateY(0.5px); }

.btn--lg { height: var(--control-h-lg); font-size: var(--fs-title); }
.btn--icon { width: var(--control-h); padding: 0; }

.btn--palette-trigger { gap: var(--sp-2); color: var(--text-faint); font-size: var(--fs-caption); font-weight: 400; padding-inline: var(--sp-3); }
.btn--palette-trigger kbd { font-family: var(--font-num); font-size: 11px; background: var(--paper-sunken); border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 6px; color: var(--text-soft); }

.overflow-wrap { position: relative; }
.overflow-menu {
  position: absolute;
  inset-inline-end: 0;
  top: calc(100% + var(--sp-2));
  min-width: 200px;
  background: var(--paper-raised);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-mid);
  box-shadow: 0 10px 28px rgba(30, 25, 15, .16);
  padding: var(--sp-1);
  z-index: 20;
}
.overflow-menu[hidden] { display: none; }
.overflow-menu button {
  display: flex;
  width: 100%;
  text-align: start;
  background: none;
  border: 0;
  padding: var(--sp-2) var(--sp-3);
  font-family: var(--font-ui);
  font-size: var(--fs-body);
  color: var(--text);
  border-radius: var(--r-inner);
  cursor: pointer;
}
.overflow-menu button:hover, .overflow-menu button:focus-visible { background: var(--paper-sunken); }

.command-palette__item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-inner);
  font-size: var(--fs-body);
  color: var(--text);
  cursor: pointer;
}
.command-palette__item--sel { background: var(--ink-wash); color: var(--ink); }
.command-palette__item--sel .text-faint { color: var(--ink); opacity: .75; }

.icon { width: 16px; height: 16px; stroke-width: 1.5; }
.icon--standalone { width: 20px; height: 20px; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  height: 28px;
  padding: 0 var(--sp-3);
  border-radius: var(--r-round);
  font-size: var(--fs-caption);
  background: var(--paper-raised);
  border: 1px solid var(--line);
  color: var(--text-soft);
}

.pill:hover:not([aria-pressed="true"]):not(:disabled) { border-color: var(--line-strong); color: var(--text); }

.pill[aria-pressed="true"] {
  background: var(--ink-wash);
  color: var(--ink);
  border-color: var(--ink);
  font-weight: 600;
}

.pill__count {
  font-family: var(--font-num);
  font-size: 10.5px;
  line-height: 1;
  padding: 2px 6px;
  border-radius: var(--r-round);
  background: rgba(43, 42, 38, .08);
  color: var(--text-soft);
}
.pill[aria-pressed="true"] .pill__count { background: rgba(31, 111, 92, .16); color: var(--ink); }

.switch {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--fs-caption);
  color: var(--text-soft);
}

.switch__track {
  width: 32px;
  height: 18px;
  border-radius: var(--r-round);
  background: var(--line-strong);
  position: relative;
}

.switch__track::after {
  content: "";
  position: absolute;
  top: 2px;
  inset-inline-start: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--paper-raised);
}

.switch[aria-checked="true"] .switch__track { background: var(--ink); }
.switch[aria-checked="true"] .switch__track::after { inset-inline-start: 16px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  height: 26px;
  padding: 0 var(--sp-2) 0 var(--sp-1);
  border-radius: var(--r-inner);
  background: var(--paper-sunken);
  font-size: var(--fs-caption);
  color: var(--text);
}

.chip strong { font-weight: 600; }
.chip__clear { color: var(--text-faint); padding: 0 var(--sp-1); }
.chip__clear:hover { color: var(--text); }

.field {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.field label { font-size: var(--fs-caption); color: var(--text-soft); }

.input, .select {
  height: var(--control-h);
  padding: 0 var(--sp-3);
  background: var(--paper-sunken);
  border: 1px solid var(--line);
  border-radius: var(--r-mid);
  color: var(--text);
}

.input:focus, .select:focus {
  border-color: var(--ink);
  box-shadow: 0 0 0 2px var(--ink-wash);
}

.input--lg { height: var(--control-h-lg); font-size: var(--fs-title); }

.table-wrap {
  border: 1px solid var(--line);
  border-radius: var(--r-outer);
  overflow: hidden;
  background: var(--paper-raised);
}

table.grid { table-layout: fixed; }

.grid thead th {
  background: var(--paper-sunken);
  border-bottom: 2px solid var(--line-strong);
  font-size: var(--fs-caption);
  font-weight: 600;
  color: var(--text-soft);
  text-align: start;
  padding: var(--sp-2) var(--sp-3);
  height: var(--row-h);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.grid thead th.has-filter { color: var(--ink); }

.grid tbody td {
  height: var(--row-h);
  padding: 0 var(--sp-3);
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.grid tbody tr:hover td { background: color-mix(in srgb, var(--paper-sunken) 50%, transparent); }

.grid tbody tr[aria-selected="true"] td { background: var(--ink-wash); }
.grid tbody tr[aria-selected="true"] td:first-child { border-inline-start: 2px solid var(--ink); }

.grid tr.block-close td {
  border-bottom: 2px solid var(--line-strong);
}

.grid tr.block-close td.cell-num.money {
  color: var(--brass);
  font-weight: 600;
}

.grid tr.group-header td {
  background: var(--paper-sunken);
  font-weight: 600;
  font-size: var(--fs-strong);
}

.grid tr.group-header .count { font-family: var(--font-num); color: var(--text-soft); }

.grid tr.filler td { color: transparent; user-select: none; }

.cell--filled {
  text-decoration: underline;
  text-decoration-color: var(--line-strong);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

.cell--filled-visible {
  background: var(--paper-sunken);
  border-inline-start: 2px solid var(--line-strong);
}

.cell--selected {
  box-shadow: inset 0 0 0 2px var(--ink);
}

.validation-row {
  border-inline-start: 3px solid var(--err);
  background: var(--err-wash);
}

.validation-row.severity-warning { border-inline-start-color: var(--warn); background: var(--warn-wash); }
.validation-row.severity-info { border-inline-start-color: var(--text-faint); background: transparent; }

.validation-msg {
  font-size: var(--fs-caption);
  color: var(--err);
  margin-top: 2px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  padding: 2px var(--sp-2);
  border-radius: var(--r-inner);
  font-size: var(--fs-caption);
  font-weight: 600;
}

  var ENUM_FIELDS = ["budget", "shift", "dispense"];

    var mappedTargets = mappedFieldSet(mapping);

      if (p.severity === "warning") warningRowIndexes[p.rowIndex] = true;

      errorRowIndexes: errorRowIndexes,

})();

PH.importer = (function () {
  var cfg = PH.config;
  var norm = PH.normalize;

  var QUANTITY_FIELDS = { dispensed: true, received: true, balance: true, serial: true };

  function readWorkbookFromArrayBuffer(buf) {
    return XLSX.read(buf, { type: "array" });
  }

  function readWorkbookFromText(text, delimiter) {
    return XLSX.read(text, { type: "string", FS: delimiter || undefined });
  }

  function sheetToAoa(worksheet, range) {
    return XLSX.utils.sheet_to_json(worksheet, { header: 1, range: range || 0, blankrows: true, defval: null });
  }

  function sheetThumbnails(workbook) {
    return workbook.SheetNames.map(function (name) {
      var ws = workbook.Sheets[name];
      var rows = sheetToAoa(ws).slice(0, 5);
      return { name: name, preview: rows };
    });
  }

  function fuzzyMatchColumnToField(headerText) {
    if (headerText === null || headerText === undefined) return null;
    var target = norm.normalizeForMatch(String(headerText));
    for (var i = 0; i < cfg.FIELDS.length; i++) {
      var f = cfg.FIELDS[i];
      var cand = norm.normalizeForMatch(f.header);
      if (cand.full === target.full || cand.full === target.noArticle || cand.noArticle === target.full || cand.noArticle === target.noArticle) {
        return f.key;
      }
    }
    return null;
  }

  function detectHeaderRow(aoaSample) {
    var limit = Math.min(10, aoaSample.length);
    var bestIdx = 0, bestScore = -1;
    for (var i = 0; i < limit; i++) {
      var row = aoaSample[i] || [];
      var score = 0;
      for (var c = 0; c < row.length; c++) {
        if (fuzzyMatchColumnToField(row[c])) score++;
      }
      if (score > bestScore) { bestScore = score; bestIdx = i; }
    }
    return { rowIndex: bestIdx, score: bestScore };
  }

  function buildMapping(headerRow) {
    var mapping = {};
    for (var c = 0; c < headerRow.length; c++) {
      mapping[c] = fuzzyMatchColumnToField(headerRow[c]);
    }
    return mapping;
  }

  function isRowEmpty(cells) {
    for (var i = 0; i < cells.length; i++) {
      if (cells[i] !== null && cells[i] !== undefined && String(cells[i]).trim() !== "") return false;
    }
    return true;
  }

  function coerceField(fieldKey, rawVal) {
    var fieldDef = cfg.FIELDS_BY_KEY[fieldKey];
    if (!fieldDef) return null;
    if (rawVal === undefined) rawVal = null;
    if (fieldKey === "month") return norm.parseMonthValue(rawVal);
    if (fieldDef.type === "number") return norm.parseNumber(rawVal);
    if (fieldDef.type === "integer") return norm.parseInteger(rawVal);
    if (fieldDef.type === "enum" || fieldDef.type === "text") {
      if (rawVal === null || rawVal === undefined) return null;
      var s = String(rawVal).trim();
      return s === "" ? null : s;
    }
    return rawVal;
  }

  function extractRows(worksheet, headerRowIndex, mapping) {
    var aoa = sheetToAoa(worksheet, headerRowIndex);
    var dataRows = aoa.slice(1);
    var colIndexes = Object.keys(mapping).map(Number);
    var out = [];
    for (var r = 0; r < dataRows.length; r++) {
      var cells = dataRows[r];
      if (isRowEmpty(cells)) continue;
      var row = { __raw: {} };
      colIndexes.forEach(function (c) {
        var fieldKey = mapping[c];
        if (!fieldKey) return;
        var rawVal = cells[c];
        row.__raw[fieldKey] = rawVal;
        row[fieldKey] = coerceField(fieldKey, rawVal);
      });
      out.push(row);
    }
    return out;
  }

  function detectVerticalMerges(worksheet) {
    var merges = worksheet["!merges"] || [];
    return merges.filter(function (m) { return m.s.c === m.e.c && m.e.r > m.s.r; });
  }

  function detectMergeFillSuggestions(worksheet, mapping, headerRowIndex) {
    var merges = detectVerticalMerges(worksheet);
    var suggestions = {};
    merges.forEach(function (m) {
      if (m.s.r <= headerRowIndex) return;
      var colIdx = m.s.c;
      var fieldKey = mapping[colIdx];
      if (!fieldKey || QUANTITY_FIELDS[fieldKey]) return;
      var blankCells = m.e.r - m.s.r;
      if (!suggestions[colIdx]) suggestions[colIdx] = { fieldKey: fieldKey, blankCells: 0, ranges: 0 };
      suggestions[colIdx].blankCells += blankCells;
      suggestions[colIdx].ranges += 1;
    });
    return suggestions;
  }

  function parseClipboardText(text) {
    var delimiter = text.indexOf("\t") !== -1 ? "\t" : (text.indexOf(";") !== -1 ? ";" : ",");
    var wb = readWorkbookFromText(text, delimiter);
    return wb;
  }

  function fileExtensionOf(filename) {
    var idx = filename.lastIndexOf(".");
    return idx === -1 ? "" : filename.slice(idx + 1).toLowerCase();
  }

  return {
    readWorkbookFromArrayBuffer: readWorkbookFromArrayBuffer,
    readWorkbookFromText: readWorkbookFromText,
    sheetToAoa: sheetToAoa,
    sheetThumbnails: sheetThumbnails,
    fuzzyMatchColumnToField: fuzzyMatchColumnToField,
    detectHeaderRow: detectHeaderRow,
    buildMapping: buildMapping,
    extractRows: extractRows,
    detectVerticalMerges: detectVerticalMerges,
    detectMergeFillSuggestions: detectMergeFillSuggestions,
    parseClipboardText: parseClipboardText,
    fileExtensionOf: fileExtensionOf,
    coerceField: coerceField,
    isRowEmpty: isRowEmpty

})();

PH.average = (function () {
  var cfg = PH.config;
  var reports = PH.reports;
  var blk = PH.blocks;
  var QS = 1000n;
  var PS = 10000n;

    return { wq: 0n, wqp: 0n, sp: 0n, n: 0, min: null, max: null, keys: new Set(), filledN: 0, rowValueSum: 0n };
  }

  function mergePriceAcc(a, b) {
    var keys = new Set(a.keys);
    b.keys.forEach(function (k) { keys.add(k); });
    return {
      wq: a.wq + b.wq, wqp: a.wqp + b.wqp, sp: a.sp + b.sp, n: a.n + b.n,
      min: a.min === null ? b.min : (b.min === null ? a.min : (a.min < b.min ? a.min : b.min)),
      max: a.max === null ? b.max : (b.max === null ? a.max : (a.max > b.max ? a.max : b.max)),
      keys: keys,
      filledN: a.filledN + b.filledN,
      rowValueSum: a.rowValueSum + b.rowValueSum
    };
  }

  function addRowToPriceAcc(acc, priceScaled, weightScaled, wasFilled) {
    var w = weightScaled === undefined || weightScaled === null ? 0n : weightScaled;
    var single = {
      wq: w, wqp: w * priceScaled, sp: priceScaled, n: 1,
      min: priceScaled, max: priceScaled,
      keys: new Set([priceScaled.toString()]),
      filledN: wasFilled ? 1 : 0,
      // Round at the row: each row's contribution to the value total is
      // rounded once here, matching valueSFromScaled, so summing rows never
      // disagrees with computeMovement/computeGroups summing the same rows.

  function weightedAverageAtPS(acc) {
    if (acc.wq === 0n) return null;
    return blk.divRoundBigInt(acc.wqp, acc.wq);

  function simpleAverage(acc) {

    });

    var groups = reports.groupRows(filtered, ["name", "unit"]);

    var out = groups.map(function (g) {
      var acc = accumulateGroup(g.rows, weightField, zeroWeightPolicy);
      var wavgPS = weightedAverageAtPS(acc);

        name: g.display.name,
        unit: g.display.unit,

      unit: "",

          return isNaN(n) ? null : n;
        }
        return v;
      });
    });
    return [header].concat(body);
  }

  function buildWorksheet(rows, columns) {
    var aoa = rowsToAoa(rows, columns);
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aoa.length - 1, c: columns.length - 1 } }) };
    // NOTE: ws["!views"]/ws["!freeze"] are the documented-looking API for
    // per-sheet RTL and frozen header rows, but SheetJS's free/Community
    // writer silently drops both (confirmed by inspecting the written XML -
    // neither rightToLeft="1" nor a <pane> element is emitted). RTL is set
    // at the workbook level instead (wb.Workbook.Views, at each book_new()
    // call below), which the writer does honor. Frozen headers have no CE
    // equivalent - that needs the Pro build.

    var colWidths = columns.map(function (c, idx) {
      var maxLen = (cfg.COLUMN_LABELS[c] || c).length;
      rows.forEach(function (row) {
        var v = row[c];
        var s = v === null || v === undefined ? "" : String(v);
        if (s.length > maxLen) maxLen = s.length;
      });
      return { wch: Math.min(40, maxLen + 2) };
    });
    ws["!cols"] = colWidths;

    for (var r = 1; r <= rows.length; r++) {
      columns.forEach(function (c, ci) {
        var cellRef = XLSX.utils.encode_cell({ r: r, c: ci });
        var cell = ws[cellRef];
        if (!cell) return;
        if (cfg.MONEY_COLUMNS[c]) {
          var decimals = cfg.decimalsForColumn(c);
          cell.z = "#,##0." + "0".repeat(decimals);
        }
        if (rows[r - 1][c] === null || rows[r - 1][c] === undefined) {
          delete ws[cellRef];
        }
      });
    }

    return ws;
  }

  function sheetNameFor(combination, reportLabel, existingNames) {
    var raw = reportLabel + " " + dimensionSegment(combination).replace(/-/g, " ");
    raw = raw.replace(/[\[\]:*?/\\]/g, "");
    raw = raw.slice(0, 31);
    var name = raw;
    var n = 2;
    while (existingNames.indexOf(name) !== -1) {
      var suffix = "_" + n;
      name = raw.slice(0, 31 - suffix.length) + suffix;
      n++;
    }
    existingNames.push(name);
    return name;
  }

  function exportImportTemplate() {
    var dataHeaders = cfg.FIELDS.map(function (f) { return f.header; });
    var exampleRows = [
      ["قوى عاملة", "صباحي", "مجاني", "A", 1, "Panadol Extra", "20 T", 5, 12.5, 62.5, "مسكنات", "2026-01", null, 100, null, null],
      ["طلاب", "مسائي", "منفذ", "A", 2, "Amaryl 10 T", "10 T", 3, 25.75, 77.25, "مضادات السكري", "2026-01", null, 40, null, null],
      ["مواليد", "صباحي", "تحمل", "B", 1, "Augmentin 1g", "14 T", 2, 45, 90, "مضادات حيوية", "2026-01", null, 12, null, null]
    ];
    var dataAoa = [dataHeaders].concat(exampleRows);
    var dataWs = XLSX.utils.aoa_to_sheet(dataAoa);
    dataWs["!cols"] = dataHeaders.map(function (h) { return { wch: Math.max(12, h.length + 4) }; });

    var enumNotes = {
      budget: cfg.DIMENSIONS.budget.join("، "),
      shift: cfg.DIMENSIONS.shift.join("، "),
      dispense: cfg.DIMENSIONS.dispense.join("، ")
    };
    var extraNotes = {
      dispensedValue: "تُستخدم للتحقق فقط — تُحسب تلقائيًا (المنصرف × السعر)",
      group: "أضف هذا العمود لتفعيل تقرير \"المجموعات الدوائية\"",
      balance: "مطلوب لتقريرَي \"الجرد السنوي\" و\"الرصيد\"",
      book: "رمز الدفتر، مثال: A، B",
      unit: "وحدة القياس، مثال: 20 T",
      month: "مثال: 2026-01"
    };
    var guideHeaders = ["العمود", "مطلوب؟", "النوع", "ملاحظات"];
    var guideRows = cfg.FIELDS.map(function (f) {
      var typeLabel = { enum: "قائمة", text: "نص", number: "رقم", integer: "رقم صحيح" }[f.type] || f.type;
      var note = enumNotes[f.key] || extraNotes[f.key] || "";
      return [f.header, f.required ? "نعم" : "اختياري", typeLabel, note];
    });
    var guideAoa = [guideHeaders].concat(guideRows);
    var guideWs = XLSX.utils.aoa_to_sheet(guideAoa);
    guideWs["!cols"] = [{ wch: 16 }, { wch: 10 }, { wch: 12 }, { wch: 55 }];

    var wb = XLSX.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    XLSX.utils.book_append_sheet(wb, dataWs, "البيانات");
    XLSX.utils.book_append_sheet(wb, guideWs, "دليل الحقول");
    var fileName = "قالب-استيراد-دفتر.xlsx";
    XLSX.writeFile(wb, fileName);
    return fileName;
  }

  function exportSingleWorkbook(sheets, opts) {
    var wb = XLSX.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    var usedNames = [];
    sheets.forEach(function (sheet) {
      var ws = buildWorksheet(sheet.rows, sheet.columns);
      var name = sheetNameFor(sheet.combination, cfg.REPORTS_BY_ID[opts.reportId].label, usedNames);
      XLSX.utils.book_append_sheet(wb, ws, name);
    });
    var fileName = buildFileName({ month: opts.month, reportId: opts.reportId, combination: (sheets[0] && sheets[0].combination) || { budget: null, shift: null, dispense: null }, descriptor: opts.descriptor, ext: "xlsx" });
    XLSX.writeFile(wb, fileName);
    return fileName;
  }

  function exportZipPerSheet(sheets, opts) {
    var zip = new JSZip();
    var usedNames = [];
    var zipName = buildFileName({ month: opts.month, reportId: opts.reportId, combination: { budget: null, shift: null, dispense: null }, descriptor: opts.descriptor, ext: "zip" });
    var index = 0;
    if (opts.onProgress) opts.onProgress(0, sheets.length);
    return new Promise(function (resolve, reject) {
      function next() {
        if (index >= sheets.length) {
          zip.generateAsync({ type: "blob" }, { onUpdate: function (meta) { if (opts.onProgress) opts.onProgress(sheets.length, sheets.length, meta.percent); } }).then(function (blob) {
            downloadBlob(blob, zipName);
            resolve(zipName);
          }).catch(reject);
          return;
        }
        try {
          var sheet = sheets[index];
          var wb = XLSX.utils.book_new();
          wb.Workbook = { Views: [{ RTL: true }] };
          var ws = buildWorksheet(sheet.rows, sheet.columns);
          XLSX.utils.book_append_sheet(wb, ws, sheetNameFor(sheet.combination, cfg.REPORTS_BY_ID[opts.reportId].label, []));
          var buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
          var name = buildFileName({ month: opts.month, reportId: opts.reportId, combination: sheet.combination, descriptor: opts.descriptor, ext: "xlsx" });
          name = resolveCollision(name, usedNames);
          usedNames.push(name);
          zip.file(name, buf);
          index++;
          if (opts.onProgress) opts.onProgress(index, sheets.length);
          setTimeout(next, 0);
        } catch (err) { reject(err); }
      }
      next();
    });
  }

  function rowsToCsv(rows, columns, separator) {
    var sep = separator || ",";
    var lines = [columns.map(function (c) { return cfg.COLUMN_LABELS[c] || c; }).join(sep)];
    rows.forEach(function (row) {
      var line = columns.map(function (c) {
        var v = row[c];
        if (v === null || v === undefined) return "";
        if (typeof v === "bigint") return PH.blocks.formatScaled(v, cfg.decimalsForColumn(c), false);
        var s = String(v);
        if (s.indexOf(sep) !== -1 || s.indexOf('"') !== -1 || s.indexOf("\n") !== -1) {
          s = '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      }).join(sep);
      lines.push(line);
    });
    return "\uFEFF" + lines.join("\r\n");
  }

  function exportCsv(rows, columns, opts) {
    var csv = rowsToCsv(rows, columns, opts.separator);
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    var fileName = buildFileName({ month: opts.month, reportId: opts.reportId, combination: opts.combination, descriptor: opts.descriptor, ext: "csv" });
    downloadBlob(blob, fileName);
    return fileName;
  }

  function downloadBlob(blob, fileName) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  return {
    buildFileName: buildFileName,
    resolveCollision: resolveCollision,
    dimensionSegment: dimensionSegment,
    buildWorksheet: buildWorksheet,
    sheetNameFor: sheetNameFor,
    exportImportTemplate: exportImportTemplate,
    exportSingleWorkbook: exportSingleWorkbook,
    exportZipPerSheet: exportZipPerSheet,
    rowsToCsv: rowsToCsv,
    exportCsv: exportCsv,
    downloadBlob: downloadBlob
  };
})();


window.PH = window.PH || {};

PH.selftest = (function () {
  var blk = PH.blocks;
  var reports = PH.reports;
  var avg = PH.average;
  var paginate = PH.paginate;
  var store = PH.store;
  var cfg = PH.config;

  function makeResult() {
    return { pass: 0, fail: 0, failures: [] };
  }

  function check(result, cond, label) {
    if (cond) result.pass++;
    else { result.fail++; result.failures.push(label); }
  }

  function runBlocksInvariants() {
    var result = makeResult();
    function makeRows(n) {
      var rows = [];
      for (var i = 0; i < n; i++) rows.push({ value: (i + 1) * 100 });
      return rows;
    }
    [7, 23, 24, 50, 100, 240].forEach(function (n) {
      [1, 2, 9, 10, 24, 100].forEach(function (blockSize) {
        ["block", "running"].forEach(function (mode) {
          [true, false].forEach(function (partial) {
            var rows = makeRows(n);
            var out = blk.applyBlocks(rows, { blockSize: blockSize, cumulativeMode: mode, cumulativeAgg: "sum", showPartialBlockTotal: partial, valueField: "value" });
            var grandTotal = 0n;
            for (var i = 0; i < n; i++) grandTotal += BigInt(rows[i].value);
            for (var i2 = 0; i2 < n; i2++) {
              var closesFullBlock = (i2 + 1) % blockSize === 0;
              var isLast = i2 === n - 1;
              var closesPartial = isLast && partial && !closesFullBlock;
              var shouldClose = closesFullBlock || closesPartial;
              var did = out[i2].cumulative !== null;
              check(result, did === shouldClose, "block-close-index n=" + n + " bs=" + blockSize + " mode=" + mode + " i=" + i2);
            }
            if (mode === "running") {
              var lastRow = out[n - 1];
              var lastCloses = (n % blockSize === 0) || partial;
              if (lastCloses) check(result, lastRow.cumulative === grandTotal, "running-final n=" + n + " bs=" + blockSize);
            }
            if (mode === "block" && partial) {
              var sumOfBlocks = 0n;
              for (var i3 = 0; i3 < n; i3++) if (out[i3].cumulative !== null) sumOfBlocks += out[i3].cumulative;
              check(result, sumOfBlocks === grandTotal, "block-sum n=" + n + " bs=" + blockSize);
            }
          });
        });
      });
    });
    return result;
  }

  function runReportParity(source, expected) {
    var result = makeResult();
    var movementSettings = { blockSize: 10, cumulativeMode: "block", showPartialBlockTotal: true };
    var yiSettings = { blockSize: 24, cumulativeMode: "running", showPartialBlockTotal: true };

    var movement = reports.computeMovement(source, movementSettings);
    check(result, movement.grandTotal.toString() === expected.movement.grandTotal, "movement grand total parity");
    check(result, movement.rows.length === expected.movement.rows.length, "movement row count parity");

    var groups = reports.computeGroups(source, {});
    check(result, groups.grandTotal.toString() === expected.groups.grandTotal, "groups grand total parity");

    var yi = reports.computeYearlyInventory(source, yiSettings);
    check(result, yi.grandTotal.toString() === expected.yearlyInventory.grandTotal, "yearly inventory grand total parity");

    var balance = reports.computeBalance(source, {});
    check(result, balance.rows.length === expected.balance.rows.length, "balance row count parity");

    return result;
  }

  function runPrintInvariants() {
    var result = makeResult();
    var rowsPerPageOptions = [9, 10, 24, 7, 33];
    var rowCounts = [0, 1, 8, 9, 10, 11, 23, 24, 25, 100, 1000];

    rowsPerPageOptions.forEach(function (rpp) {
      rowCounts.forEach(function (rc) {
        [false, true].forEach(function (grouped) {
          var slots = [];
          if (!grouped) {
            for (var i = 0; i < rc; i++) slots.push({ kind: "data" });
          } else {
            for (var j = 0; j < rc; j++) {
              if (j % 5 === 0) slots.push({ kind: "group-header" });
              slots.push({ kind: "data" });
            }
          }
          var res = paginate.buildPages(slots, rpp);
          var expectedPageCount = Math.max(1, Math.ceil(slots.length / rpp));
          check(result, res.pageCount === expectedPageCount, "page-count rpp=" + rpp + " rc=" + rc + " grouped=" + grouped);
          var allFull = res.pages.every(function (p) { return p.rows.length === rpp; });
          check(result, allFull, "slot-count rpp=" + rpp + " rc=" + rc + " grouped=" + grouped);
        });
      });
    });

    [9, 10, 24].forEach(function (rpp) {
      ["portrait", "landscape"].forEach(function (orientation) {
        var geo = { marginTopMm: 15, marginBottomMm: 15, headerMm: 12, totalsMm: 8, footerMm: 10, rowsPerPage: rpp, orientation: orientation };
        var res = paginate.assertGeometry(geo);
        check(result, res.ok, "geometry rpp=" + rpp + " orientation=" + orientation);
      });
    });

    return result;
  }

  function runAverageInvariants(source) {
    var result = makeResult();
    var avgResult = avg.computeAveragePrices(source, { weightField: "dispensed" });
    var movementResult = reports.computeMovement(source, { blockSize: 10, cumulativeMode: "block", showPartialBlockTotal: true });
    var groupsResult = reports.computeGroups(source, { blockSize: 10, cumulativeMode: "block", showPartialBlockTotal: true });

    // Round at the row, sum exactly: every report sums the same per-row
    // rounded values, so these must agree to the last scaled unit - zero
    // tolerance, not "close enough".
    check(result, avgResult.grandTotal.value === movementResult.grandTotal,
      "average-report reconciles exactly with movement grand total (avg=" + avgResult.grandTotal.value + ", movement=" + movementResult.grandTotal + ")");
    check(result, groupsResult.grandTotal === movementResult.grandTotal,
      "groups-report reconciles exactly with movement grand total (groups=" + groupsResult.grandTotal + ", movement=" + movementResult.grandTotal + ")");

    avgResult.rows.forEach(function (r) {
      if (r.priceMin === null) return;
      var wavgPS = avg.weightedAverageAtPS(r.__acc);
      check(result, r.priceMin <= wavgPS && wavgPS <= r.priceMax, "bounds for " + r.name + " " + r.unit);
    });

    return result;
  }

  function runMovingAverageInvariants() {
    var result = makeResult();

    // Two items received and dispensed in the same books/months at
    // different prices. Pooling them through one accumulator (the pre-fix
    // behaviour) would blend Item B's price into Item A's cost. Each item's
    // moving average must depend only on its own receipts.
    var rows = [
      { book: "A", serial: 1, name: "Item A", unit: "علبة", month: "2026-01", received: 10, dispensed: 0, price: 10 },
      { book: "A", serial: 2, name: "Item B", unit: "علبة", month: "2026-01", received: 10, dispensed: 0, price: 100 },
      { book: "A", serial: 3, name: "Item A", unit: "علبة", month: "2026-01", received: 0, dispensed: 5, price: 10 },
      { book: "A", serial: 4, name: "Item B", unit: "علبة", month: "2026-01", received: 0, dispensed: 5, price: 100 }
    ];
    var out = avg.computeMovingAverage(rows).rows;
    check(result, out[2].movingAvg === 100000n, "Item A moving average unaffected by Item B's price (got " + out[2].movingAvg + ")");
    check(result, out[3].movingAvg === 1000000n, "Item B moving average unaffected by Item A's price (got " + out[3].movingAvg + ")");
    check(result, out[2].valueOut === 500000n, "Item A dispense costed at its own average (got " + out[2].valueOut + ")");
    check(result, out[3].valueOut === 5000000n, "Item B dispense costed at its own average (got " + out[3].valueOut + ")");

    return result;
  }

  function runFillInvariants() {
    var result = makeResult();
    for (var seed = 0; seed < 30; seed++) {
      var rows = [];
      var n = 30;
      for (var i = 0; i < n; i++) {
        var blank = Math.random() < 0.4;
        rows.push({ book: "A", group: blank ? "" : ("G" + Math.floor(Math.random() * 5)) });
      }
      var before = rows.map(function (r) { return r.group; });
      var out = store.fillBlanks(rows, { column: "group", direction: "down", mode: "blanksOnly", boundaryColumn: null });
      var ok = true;
      for (var j = 0; j < n; j++) {
        if (!store.isBlankCell(before[j]) && out.rows[j].group !== before[j]) ok = false;
      }
      check(result, ok, "blanksOnly-never-overwrites seed=" + seed);
    }

    var boundaryRows = [{ book: "A", group: "X" }, { book: "A", group: "" }, { book: "B", group: "" }];
    var boundaryResult = store.fillBlanks(boundaryRows, { column: "group", direction: "down", mode: "blanksOnly", boundaryColumn: "book" });
    check(result, boundaryResult.rows[1].group === "X", "boundary-inherit-within-book");
    check(result, store.isBlankCell(boundaryResult.rows[2].group), "boundary-stop-across-book");

    return result;
  }

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function generateFixtureSource(seed, count) {
    var rnd = mulberry32(seed);
    var drugs = [
      { name: "Amaryl 10 T", unit: "10 T" },
      { name: "Panadol Extra", unit: "20 T" },
      { name: "Augmentin 1g", unit: "14 T" },
      { name: "Concor 5mg", unit: "30 T" },
      { name: "Zantac Syrup", unit: "150 ML" },
      { name: "Ventolin Inhaler", unit: "1 PC" }
    ];
    var books = ["A", "B", "C"];
    var rows = [];
    for (var i = 0; i < count; i++) {
      var d = drugs[Math.floor(rnd() * drugs.length)];
      var price = Math.round((5 + rnd() * 200) * cfg.SCALE_PRICE) / cfg.SCALE_PRICE;
      var dispensed = Math.round(rnd() * 50 * cfg.SCALE_QTY) / cfg.SCALE_QTY;
      var balance = Math.round(rnd() * 500 * cfg.SCALE_QTY) / cfg.SCALE_QTY;
      rows.push({
        budget: "قوى عاملة", shift: "صباحي", dispense: "مجاني",
        book: books[Math.floor(rnd() * books.length)],
        serial: i + 1,
        name: d.name, unit: d.unit,
        dispensed: rnd() < 0.05 ? null : dispensed,
        price: price,
        group: null, month: "2026-01", received: null,
        balance: rnd() < 0.05 ? null : balance,
        pharmacy: null, pageNo: null
      });
    }
    for (var t = 0; t < 3; t++) {
      rows.push({
        budget: "قوى عاملة", shift: "صباحي", dispense: "مجاني", book: cfg.TOTAL_ROW_MARKER,
        serial: null, name: "", unit: "", dispensed: null, price: null,
        group: null, month: null, received: null, balance: null, pharmacy: null, pageNo: null
      });
    }
    return rows;
  }

  function computeExpectedFixture(source) {
    function scaleQtyBigLocal(v) { return (v === null || v === undefined || v === "") ? 0n : BigInt(Math.round(v * cfg.SCALE_QTY)); }
    function scalePriceBigLocal(v) { return (v === null || v === undefined || v === "") ? 0n : BigInt(Math.round(v * cfg.SCALE_PRICE)); }

    var movementRowCount = 0;
    var movementGrand = 0n;
    source.forEach(function (r) {
      if (r.dispensed === null || r.dispensed === undefined || r.dispensed === 0) return;
      movementRowCount++;
      movementGrand += blk.divRoundBigInt(scalePriceBigLocal(r.price) * scaleQtyBigLocal(r.dispensed), 1000n);
    });

    var groupsGrand = 0n;
    source.forEach(function (r) {
      if (r.book === cfg.TOTAL_ROW_MARKER) return;
      groupsGrand += blk.divRoundBigInt(scalePriceBigLocal(r.price) * scaleQtyBigLocal(r.dispensed), 1000n);

    // per group - never round the group's summed balance. Matches
    // computeYearlyInventory (see 2026-08 review).
    var yiGrand = 0n;
    source.forEach(function (r) {

    var balanceRowCount = 0;
    Object.keys(balGroups).forEach(function () { balanceRowCount++; });

    return {
      movement: { grandTotal: movementGrand.toString(), rows: { length: movementRowCount } },
      groups: { grandTotal: groupsGrand.toString() },
      yearlyInventory: { grandTotal: yiGrand.toString() },
      balance: { rows: { length: balanceRowCount } }

  }

  function runAll() {

  // Regression checks for specific bugs found in review (2026-08). Unlike

  //

  function runRegressionInvariants() {
    var result = makeResult();

    // Hand-computed fixture: 3 items / 4 dispensing rows + 1 Total-marker row

  function openCommandPalette() {

      else if (e.key === "ArrowUp") { e.preventDefault(); selected = Math.max(0, selected - 1); renderList(); }

  function renderTableArea(container) {
    var sheet = computeActiveSheet();
    var repDef = cfg.REPORTS_BY_ID[state.activeReportId];
    var textCols = repDef.columns.filter(function (c) { return !cfg.MONEY_COLUMNS[c] && c !== "pageNo" && c !== "printPageNo"; });

    var pipeline = query.runPipeline(sheet.rows, state.queryState, textCols, columnTypesFor(repDef.columns));
    var displayRows = pipeline.sorted;

    var countLabel = $("row-count-label");
    if (countLabel) countLabel.textContent = "عرض " + pipeline.resultCount + " من " + pipeline.totalCount;

    var newKey = state.activeReportId + "|" + sheet.rows.length;
    if (tableController && tableControllerKey === newKey && tableControllerContainer === container) {
      tableController.setRows(displayRows);
      return;
    }
    if (tableController) tableController.destroy();
    container.innerHTML = "";
    tableControllerKey = newKey;
    tableControllerContainer = container;
    tableController = PH.viewTable.createTable(container, {
      columns: repDef.columns,
      filterRows: sheet.rows,
      fillableColumns: validate.FILL_PRONE_TEXT_FIELDS,
      quantityColumns: ["dispensed", "received", "balance"],
      scopeRowIds: store.getSourceRows().filter(function (row) { return filterActiveRows([row], state.activeCombination).length > 0; }).map(function (row) { return row.id; }),
      onToast: showToast,
      queryState: state.queryState,
      onRowEdit: state.activeReportId === "sourceRows" ? openSourceRowEditor : null,
      onRowDrilldown: state.activeReportId !== "sourceRows" ? openSourceRowsForIds : null,
      onRowDelete: state.activeReportId === "sourceRows" ? function (row) {
        if (!window.confirm("حذف هذا الصف من البيانات المصدر؟")) return;

        showToast("تم حذف الصف");
      } : null,
      onSort: function (column, additive) {
        var levels = state.queryState.sortLevels.slice();
        var existingIdx = -1;
        for (var i = 0; i < levels.length; i++) if (levels[i].column === column) { existingIdx = i; break; }
        if (!additive) {
          if (existingIdx === 0 && levels.length === 1) {
            levels[0].direction = levels[0].direction === "asc" ? "desc" : (levels[0].direction === "desc" ? null : "asc");
            if (levels[0].direction === null) levels = [];
          } else {
            levels = [{ column: column, direction: "asc" }];
          }
        } else {
          if (existingIdx !== -1) {
            levels[existingIdx].direction = levels[existingIdx].direction === "asc" ? "desc" : "asc";
          } else {
            levels.push({ column: column, direction: "asc" });
          }
        }
        state.queryState.sortLevels = levels;
        renderTableArea(container);
      },
      onFilterChange: function (column, selectedValues, totalCount) {
        var filters = state.queryState.filters.filter(function (f) { return f.column !== column; });
        if (selectedValues.length < totalCount) {
          filters.push({ kind: "text-checklist", column: column, values: selectedValues });
        }
        state.queryState.filters = filters;
        renderTableArea(container);
      }
    });
    tableController.setRows(displayRows);
  }
