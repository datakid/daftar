name: Build daftar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.sh"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh build.sh
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "Build dist/daftar.html"
          git push
