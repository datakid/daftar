<body>

<div class="app-shell">
  <div class="title-bar glass">
    <div class="title-bar__mark">
      <svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" d="M7.8 11.4 L12.2 7 H15.6 C20.9 7 24.2 11 24.2 16 C24.2 21 20.9 25 15.6 25 H7.8 Z M12.6 11.9 H15.6 C17.9 11.9 19.3 13.6 19.3 16 C19.3 18.4 17.9 20.1 15.6 20.1 H12.6 Z"></path>
      </svg>
    </div>
    <div class="title-bar__name">دفتر</div>

    <div class="report-tabs" id="report-tabs" role="tablist"></div>
    <div class="report-switcher-dropdown-wrap">
      <button class="btn btn--secondary" id="btn-report-switcher-dropdown" type="button" aria-haspopup="true" aria-expanded="false">
        <span id="report-switcher-dropdown-label">تقرير</span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
    </div>

    <div class="title-bar__spacer"></div>

    <div class="search-field-wrap" id="search-field-wrap">
      <button class="search-field__icon-btn" id="search-field-icon-btn" type="button" title="بحث · Ctrl F — اكتب > للأوامر · Ctrl K">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5" stroke-linecap="round"></path></svg>
      </button>
      <input type="text" class="search-field" id="search-field" placeholder="بحث… أو اكتب &gt; للأوامر" autocomplete="off">
      <kbd class="search-field__hint">Ctrl K</kbd>
    </div>

    <button class="btn btn--secondary" id="btn-scope" type="button" aria-haspopup="true" aria-expanded="false" title="النطاق الحالي">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8Z" stroke-linejoin="round"></path></svg>
      <span id="scope-btn-label">كل النطاق</span>
      <span id="scope-btn-badge" class="pill__count" style="margin-inline-start:auto;"></span>
    </button>

    <div class="row" id="toolbar-actions">
      <button class="btn btn--secondary" id="btn-export" type="button" title="تصدير Excel (Ctrl+E)">تصدير</button>
      <button class="btn btn--primary" id="btn-print" type="button">طباعة</button>
      <button class="btn btn--ghost btn--icon" id="btn-theme" type="button" title="المظهر">
        <svg class="icon" id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></svg>
      </button>
      <button class="btn btn--ghost btn--icon" id="btn-settings-drawer" type="button" title="الإعدادات (Ctrl+,)">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 3.5v2.1M12 18.4v2.1M20.5 12h-2.1M5.6 12H3.5M17.66 6.34l-1.49 1.49M7.83 16.17l-1.49 1.49M17.66 17.66l-1.49-1.49M7.83 7.83L6.34 6.34" stroke-linecap="round"></path>
        </svg>
      </button>
      <div class="overflow-wrap">
        <button class="btn btn--ghost btn--icon" id="btn-overflow-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="overflow-menu" title="المزيد">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="5.5" r="1.6"></circle>
            <circle cx="12" cy="12" r="1.6"></circle>
            <circle cx="12" cy="18.5" r="1.6"></circle>
          </svg>
        </button>
        <div class="overflow-menu glass" id="overflow-menu" role="menu" hidden>
          <button role="menuitem" id="btn-import" title="استيراد ملف Excel أو CSV">استيراد</button>
          <button role="menuitem" id="btn-add" title="إضافة صف يدويًا">إضافة</button>
          <button role="menuitem" id="btn-template" title="تحميل نموذج بيانات فارغ مع دليل الأعمدة">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M12 4v11m0 0l-3.5-3.5M12 15l3.5-3.5" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="M5 18.5h14" stroke-linecap="round"></path>
            </svg>
            نموذج
          </button>
          <button role="menuitem" id="btn-backup" title="حفظ نسخة كاملة من البيانات والإعدادات">نسخة احتياطية</button>
          <button role="menuitem" id="btn-restore" title="استعادة نسخة كاملة من البيانات والإعدادات">استعادة</button>
          <button role="menuitem" id="btn-pharmacy-profile" title="اسم الصيدلية والشعار وبيانات الترخيص وترويسة الطباعة">بيانات الصيدلية</button>
          <button role="menuitem" id="btn-saved-views" title="حفظ إعدادات التقرير الحالي أو الرجوع إلى عرض محفوظ">العروض المحفوظة</button>
          <button role="menuitem" id="btn-selftest" title="فحص ذاتي (Ctrl+Shift+T)">فحص ذاتي</button>
        </div>
      </div>
    </div>
    <div class="title-bar__save-state" id="save-state"></div>
    <button class="save-status-dot" id="save-status-dot" type="button" title="تعذّر الحفظ — صدّر نسخة احتياطية" style="display:none;"></button>
  </div>

  <div class="save-error-banner" id="save-error-banner" role="alert" style="display:none;"></div>

  <div class="main">
    <div class="main__content" id="main-content" role="tabpanel" tabindex="0"></div>
  </div>
</div>

<div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>

<script src="xlsx.full.min.js"></script>
<script src="jszip.min.js"></script>

<script>
window.PH_FIXTURES = null;
</script>

</body>
</html>
